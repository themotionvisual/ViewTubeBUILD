<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ViewTube Top 10 Consolidated Widget Atlas</title><style>body{font-family:system-ui;background:#f5f1e8;color:#203037;margin:0;padding:24px}main{max-width:1200px;margin:auto}h1{font-size:42px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.w{border:3px solid #40545b;border-radius:18px;background:#fffdf7;box-shadow:7px 7px #ccd2cf;overflow:hidden;min-height:260px}.h{padding:14px;border-bottom:3px solid #40545b;background:#ffd3cf;font-weight:900;font-size:20px}.b{padding:16px}.viz{height:150px;border:2px solid #40545b;border-radius:14px;background:linear-gradient(135deg,#fffdf7,#ffd3cf);display:grid;place-items:center;text-align:center;font-weight:900;font-size:22px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{border:2px solid #40545b;border-radius:8px;padding:5px 7px;font-size:9px}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main><h1>TOP 10 CONSOLIDATED WIDGET ATLAS</h1><p>Standalone first-build atlas for ten winner concepts consolidated from overlapping ViewTube widget experiments.</p><section class="grid"><script>const data=[['Opportunity Radar','DISCOVERY · GAPS · MOMENTUM','Opportunity field / radar'],['Anomaly Monitor','DEVIATION · VELOCITY · CHANGE','Multi-metric signal monitor'],['Channel Intelligence Hub','CHANNEL SYSTEM · CONNECTED HEALTH','Connected intelligence map'],['Next Best Action','EVIDENCE · PRIORITY · ACTION','Ranked decision stream'],['Video Asset Engine','PACKAGE · GENERATE · COMPLETE','Video package assembly'],['Content Lifecycle','GROW · PEAK · EVERGREEN · REFRESH','Thumbnail lifecycle track'],['Audience Loop','LISTEN · LEARN · CREATE · RETURN','Audience feedback loop'],['Series & Franchise Tracker','CLUSTERS · SEQUELS · PLAYLISTS','Connected series map'],['Publishing Command','PACKAGE · PREFLIGHT · LIVE','Publishing pipeline'],['Creator Operations Radar','NOW · NEXT · BLOCKED · WAITING','Operational control board']];document.write(data.map((x,i)=>`<article class=w><div class=h>${String(i+1).padStart(2,'0')} · ${x[0]}</div><div class=b><div class=viz>${x[2]}</div><div class=tags>${x[1].split(' · ').map(t=>`<span class=tag>${t}</span>`).join('')}</div></div></article>`).join(''))</script></section></main></body></html>
