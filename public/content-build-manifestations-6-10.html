<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ViewTube Content Build Lab 06–10</title><style>body{margin:0;background:#f5f3ed;color:#101010;font-family:Arial,sans-serif;font-weight:800}.page{max-width:1500px;margin:auto;padding:24px}.hero,.p{background:#fff;border:4px solid #101010;border-radius:16px;box-shadow:8px 8px 0 #0002;margin-bottom:24px;overflow:hidden}.hero{padding:24px}h1{font-size:54px;line-height:.9;margin:8px 0}.head{padding:12px 16px;border-bottom:4px solid #101010;font-size:18px}.body{padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.card,.stage,.inspect{border:3px solid #101010;border-radius:10px;padding:10px;background:#fff}.btn,.chip,input,textarea{border:2px solid #101010;border-radius:7px;background:#fff;padding:7px 9px;font:900 9px Arial}.btn{cursor:pointer}.chip{display:inline-block;background:#eee}.pipeline{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.stage{min-height:90px;cursor:pointer}.stage.active{background:#ffe0c5}.graph{position:relative;min-height:420px;border:3px solid #101010;border-radius:12px}.node{position:absolute;transform:translate(-50%,-50%);width:80px;height:80px;border:3px solid #101010;border-radius:50%;background:#fff;font:900 8px Arial}.core{width:120px;height:120px;background:#59d9e8}.property{display:grid;grid-template-columns:220px 1fr;border:3px solid #101010;border-radius:12px;overflow:hidden}.nav button{display:block;width:100%;padding:10px;border:0;border-bottom:2px solid #101010;background:#fff;font-weight:900}.props{padding:14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:9px}.form input,.form textarea{width:100%;box-sizing:border-box}.matrix{overflow:auto;border:3px solid #101010;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border-right:2px solid #101010;border-bottom:2px solid #101010;padding:8px;font-size:9px;text-align:left}th{background:#dff2bf}@media(max-width:800px){.pipeline{grid-template-columns:repeat(2,1fr)}.property{grid-template-columns:1fr}.form{grid-template-columns:1fr}.page{padding:10px}}</style></head><body><main class="page"><section class="hero"><small>VIEWTUBE / ASSET ENGINE / REPRESENTATION LAB</small><h1>MANIFESTATIONS<br>06–10</h1><p>Five further interfaces over one canonical Content Build: generation console, pipeline, provenance graph, inspector and package matrix.</p></section><div id="app"></div></main><script>const b={id:'CB-037',title:'Napoleon’s Last Great Gamble',script:'Final V6',thumbnail:'5 variants / no final',description:'Final',chapters:'9 chapters',community:'2 posts',readiness:72};const gens=['TITLE','THUMBNAIL','DESCRIPTION','CHAPTERS','END SCREEN','COMMUNITY'];function H(n,t,s){return `<div class="head">${n} — ${t}<br><small>${s}</small></div>`}function six(){return `<section class="p">${H('06','ONE-TOUCH GENERATION CONSOLE','Context-aware generation from the whole build')}<div class="body"><div class="grid">${gens.map(x=>`<div class="card"><b>${x}</b><p><small>Context packet assembled from concept, script, audience, evidence and existing assets.</small></p><button class="btn" onclick="alert('Generate ${x} from '+b.id)">GENERATE ${x}</button> <button class="btn">OPEN TOOL</button></div>`).join('')}</div></div></section>`}const stages=['IDEA','RESEARCH','SCRIPT','VISUAL','PACKAGE','EDIT','PUBLISH','LEARN'];function seven(){return `<section class="p">${H('07','PIPELINE RAIL','Production progression and dependencies')}<div class="body"><div class="pipeline">${stages.map((x,i)=>`<div class="stage ${i===4?'active':''}" onclick="this.classList.toggle('active')"><small>0${i+1}</small><h4>${x}</h4><small>${i===4?'BLOCKED':'READY / WORKING'}</small></div>`).join('')}</div></div></section>`}function eight(){let ns=[['Research',18,18],['Audience',48,13],['Script',80,19],['Storyboard',86,48],['Thumbnail',76,78],['Publishing',49,87],['Analytics',20,80],['Title',14,50]];return `<section class="p">${H('08','ASSET + PROVENANCE GRAPH','Relationships around the canonical identity')}<div class="body"><div class="graph"><button class="node core" style="left:50%;top:50%">${b.id}<br>CONTENT BUILD</button>${ns.map(n=>`<button class="node" style="left:${n[1]}%;top:${n[2]}%" onclick="alert('${n[0]} belongs to ${b.id}')">${n[0]}</button>`).join('')}</div></div></section>`}const groups={Identity:['Title','Concept','Audience'],Narrative:['Script','Chapters','Education Questions'],Visuals:['Storyboard','Thumbnail'],Publishing:['Description','Tags','Visibility','Publish At'],Launch:['Community Posts','End Screen','Captions']};function show(g){document.querySelector('#props').innerHTML=`<h2>${g}</h2><div class="form">${groups[g].map(x=>`<label>${x}<input value="${x==='Title'?b.title:''}"></label>`).join('')}</div>`}function nine(){return `<section class="p">${H('09','INSPECTOR / PROPERTY SHEET','One inspectable creative-application object')}<div class="body"><div class="property"><nav class="nav">${Object.keys(groups).map(g=>`<button onclick="show('${g}')">${g}</button>`).join('')}</nav><div class="props" id="props"></div></div></div></section>`}const rows=[['Title','Final','8','V4','12','Title Generator'],['Thumbnail','Action','5','—','7','Thumbnail Studio'],['Script','Final','6','V6','19','Script Architect'],['Description','Final','3','V3','8','Metadata Engine'],['Storyboard','Ready','2','V2','12','Storyboard Studio'],['End Screen','Missing','0','—','4','End Screen Architect'],['Community','Ready','2','V2','5','Community Tool'],['Captions','Missing','0','—','1','Caption Tool']];function ten(){return `<section class="p">${H('10','PACKAGE MATRIX','Dense management across state, variants, evidence and tools')}<div class="body"><div class="matrix"><table><tr><th>ASSET</th><th>STATE</th><th>VARIANTS</th><th>FINAL</th><th>EVIDENCE</th><th>TOOL</th><th>ACTION</th></tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}<td><button class="btn">${r[1]==='Missing'?'GENERATE':'OPEN'}</button></td></tr>`).join('')}</table></div></div></section>`}document.querySelector('#app').innerHTML=six()+seven()+eight()+nine()+ten();show('Identity')</script></body></html>
