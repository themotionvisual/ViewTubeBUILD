<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Hexagonal World Map</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19; /* Dark elegant background */
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #mapCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #loading {
            color: #38bdf8;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: opacity 0.5s ease;
        }

        .hidden {
            opacity: 0;
        }
    </style>
    <!-- Include D3.js and TopoJSON for generating accurate world geography -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
</head>
<body>

    <div id="ui-layer">
        <div id="loading">Generating Map...</div>
    </div>

    <canvas id="mapCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');

        let width = 0;
        let height = 0;
        let dpr = window.devicePixelRatio || 1;
        let dots = [];
        let geoData = null;
        let animationFrameId = null;

        // Interaction configuration
        const MOUSE = { x: -1000, y: -1000 };
        const HOVER_RADIUS = 25; // Radius of influence for hover (1/4 of original 100)
        const MAX_RADIUS_MULTIPLIER = 1.8; // Keeps expansion elegant and subtle
        const ANIMATION_EASING = 0.12; // Springiness of the movement
        
        // Visual configuration
        const DOT_COLOR = '#38bdf8'; // Primary cyan-blue dot color
        const STROKE_COLOR = '#0284c7'; // Slightly darker blue for active dot border
        const GRID_DENSITY = 210; // High density for smaller, more abundant dots

        // Initialize and load geographic data
        async function init() {
            try {
                // Fetch world topology
                const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
                if (!response.ok) throw new Error('Network response was not ok');
                const topo = await response.json();
                
                // Convert TopoJSON to standard GeoJSON
                const countries = topojson.feature(topo, topo.objects.countries);
                
                // FILTER OUT ANTARCTICA (Antarctica ID is "010")
                countries.features = countries.features.filter(
                    f => f.id !== "010" && f.properties?.name !== "Antarctica"
                );
                
                geoData = countries;
                
                // Setup layout and window listeners
                window.addEventListener('resize', debounce(handleResize, 250));
                
                // Setup canvas and run generator (with container-ready checks)
                setupCanvasAndGenerate();
                
            } catch (error) {
                loadingEl.innerText = "Error loading map data.";
                console.error("Map initialization failed:", error);
            }
        }

        // Keep attempting to initialize sizing until parent container yields non-zero dimensions
        function setupCanvasAndGenerate() {
            setupCanvas();
            
            // Safety guard: If dimensions are 0 (hidden iframe/unloaded viewport), retry in 100ms
            if (width <= 0 || height <= 0) {
                setTimeout(setupCanvasAndGenerate, 100);
                return;
            }

            generateHexMap();
            
            // Hide loading text safely
            loadingEl.classList.add('hidden');
            
            // Start render loop
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(animate);
        }

        // Setup sharp canvas for Retina/High-DPI displays
        function setupCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = window.devicePixelRatio || 1;

            if (width <= 0 || height <= 0) return;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            ctx.scale(dpr, dpr);
        }

        // Draw the map invisibly at high resolution, then sample it on a precise hex grid
        function generateHexMap() {
            if (!geoData || width <= 0 || height <= 0) return;
            dots = []; // Reset dots

            // Create offscreen canvas matched to high-DPI scaling for ultra-precise sampling
            const offCanvas = document.createElement('canvas');
            offCanvas.width = width * dpr;
            offCanvas.height = height * dpr;
            const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
            offCtx.scale(dpr, dpr);

            // Fit projection cleanly on screen (without Antarctica squeezing everything up)
            const projection = d3.geoEquirectangular()
                .fitExtent([[width * 0.05, height * 0.1], [width * 0.95, height * 0.9]], geoData);
            
            const path = d3.geoPath().projection(projection).context(offCtx);

            // Draw the landmasses onto the offscreen canvas
            offCtx.fillStyle = '#ffffff';
            offCtx.beginPath();
            path(geoData);
            offCtx.fill();

            // Sample the high-resolution pixels
            const imgData = offCtx.getImageData(0, 0, width * dpr, height * dpr).data;

            // Hexagonal grid geometry setup
            const spacing = width / GRID_DENSITY; 
            const rowHeight = spacing * 0.8660254; // spacing * sin(60 deg) for geometric hex rows
            const baseDotRadius = spacing * 0.28; // Smaller dots for higher contrast

            for (let y = 0; y < height; y += rowHeight) {
                const isOddRow = Math.floor(y / rowHeight) % 2 !== 0;
                const offsetX = isOddRow ? spacing / 2 : 0;

                for (let x = offsetX; x < width; x += spacing) {
                    // Match screen coordinate to offscreen high-DPI pixel
                    const px = Math.floor(x * dpr);
                    const py = Math.floor(y * dpr);
                    
                    if (px >= width * dpr || py >= height * dpr) continue;

                    // Calculate index in ImageData array (RGBA format)
                    const i = (py * Math.floor(width * dpr) + px) * 4;
                    
                    // Check alpha to see if this position lands on a continent
                    if (imgData[i + 3] > 128) {
                        dots.push({
                            x: x,
                            y: y,
                            baseR: baseDotRadius,
                            r: 0, // Starts at 0 for a cool initial spawn transition
                        });
                    }
                }
            }
        }

        // Main Animation & Rendering Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Separate dots into resting (batch-rendered for speed) and active (rendered with effects)
            const restingDots = [];
            const activeDots = [];

            for (let i = 0; i < dots.length; i++) {
                const dot = dots[i];
                
                // Calculate distance to mouse
                const dx = MOUSE.x - dot.x;
                const dy = MOUSE.y - dot.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                let targetR = dot.baseR;
                let isActive = false;
                
                if (dist < HOVER_RADIUS) {
                    isActive = true;
                    const influence = 1 - (dist / HOVER_RADIUS);
                    const easeInfluence = Math.sin(influence * Math.PI / 2); // Beautiful sine curve easing
                    targetR = dot.baseR + (dot.baseR * MAX_RADIUS_MULTIPLIER * easeInfluence);
                }

                // Smoothly update current radius towards target
                dot.r += (targetR - dot.r) * ANIMATION_EASING;

                // Capture distance for layered sorting
                dot.currentDist = dist;

                // Threshold to check if the dot is resting at standard size
                if (!isActive && Math.abs(dot.r - dot.baseR) < 0.05) {
                    dot.r = dot.baseR;
                    restingDots.push(dot);
                } else {
                    activeDots.push(dot);
                }
            }
            
            // 1. Render all resting background dots in a single batch path (Optimal performance)
            ctx.fillStyle = DOT_COLOR;
            ctx.beginPath();
            for (let i = 0; i < restingDots.length; i++) {
                const dot = restingDots[i];
                ctx.moveTo(dot.x + dot.r, dot.y);
                ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
            }
            ctx.fill();

            // 2. Sort active dots in DESCENDING order of distance from cursor
            // This ensures the dot with the absolute smallest distance (closest to center) is drawn LAST (on top)
            activeDots.sort((a, b) => b.currentDist - a.currentDist);

            // 3. Render active dots with a super-thin dark blue stroke
            ctx.lineWidth = 0.8;
            ctx.strokeStyle = STROKE_COLOR;
            ctx.fillStyle = DOT_COLOR;

            for (let i = 0; i < activeDots.length; i++) {
                const dot = activeDots[i];
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        // --- Event Listeners ---

        // Mouse inputs
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            MOUSE.x = e.clientX - rect.left;
            MOUSE.y = e.clientY - rect.top;
        });

        window.addEventListener('mouseleave', () => {
            MOUSE.x = -1000;
            MOUSE.y = -1000;
        });

        // Touch inputs (Mobile support)
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                MOUSE.x = e.touches[0].clientX - rect.left;
                MOUSE.y = e.touches[0].clientY - rect.top;
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            MOUSE.x = -1000;
            MOUSE.y = -1000;
        });

        // Responsive resize
        function handleResize() {
            setupCanvas();
            if (width > 0 && height > 0) {
                generateHexMap();
            }
        }

        // Debouncer for performant window resizing
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Run application
        init();
    </script>
</body>
</html>
