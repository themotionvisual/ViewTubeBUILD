<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewTube // Geographic Performance Hub</title>
    <style>
        :root {
            --bg: #f7f4ef;
            --panel: #fffdf8;
            --ink: #111111;
            --cyan: #34c6f3;
            --pink: #f46fb0;
            --lime: #d9ff3b;
            --yellow: #ffe45a;
            --blue: #80cff7;
            --dark-blue: #0284c7;
            --gray-slate: #475569;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            background: linear-gradient(180deg, #fffaf0 0%, #f4efe8 100%);
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .module {
            width: 100%;
            max-width: 1400px;
            background: var(--panel);
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0px var(--ink);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 85vh;
        }

        .module-header {
            background: var(--pink);
            border-bottom: 2px solid var(--ink);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .module-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .module-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .viewtube-select, .pill {
            background: var(--panel);
            border: 2px solid var(--ink);
            border-radius: 99px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: 2px 2px 0px var(--ink);
            text-transform: uppercase;
            transition: all 0.1s ease;
        }
        
        .viewtube-select { background: var(--yellow); }
        .viewtube-select:active, .pill:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px var(--ink); }
        
        .pill.active {
            background: var(--lime);
            box-shadow: 0px 0px 0px var(--ink);
            transform: translate(2px, 2px);
        }

        .pill.zoom-toggle {
            background: var(--cyan);
            border-color: var(--ink);
        }
        .pill.zoom-toggle.active {
            background: var(--pink);
            color: #fff;
        }

        .module-readout {
            background: var(--panel);
            border-bottom: 2px solid var(--ink);
            padding: 8px 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
        }

        .stats-container {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            flex-grow: 1;
        }

        .stat-item {
            display: flex;
            gap: 6px;
            align-items: center;
            font-weight: 600;
            color: var(--text-muted);
        }

        .stat-val {
            color: var(--dark-blue);
            font-weight: 800;
        }

        .metric-badge {
            background: var(--cyan);
            border: 2px solid var(--ink);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .module-body {
            flex-grow: 1;
            position: relative;
            background: #0b0f19;
            overflow: hidden;
            cursor: crosshair;
        }

        #mapCanvas { display: block; width: 100%; height: 100%; }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--cyan);
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .hidden { opacity: 0; }
    </style>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

        const zoomToggleBtn = document.getElementById('zoomToggle');

        let width = 0, height = 0, dpr = window.devicePixelRatio || 1;
        let dots = [];
        let geoData = null;
        let animationFrameId = null;

        // Interaction State
        let currentMetric = 'views';
        let viewMode = 'world'; 
        let autoZoomEnabled = false;
        
        // Logical mouse tracking
        const ScreenMouse = { x: -1000, y: -1000, inBounds: false };
        const MOUSE = { x: -1000, y: -1000 };
        
        // Physics logic constants (Restored to exact requested math)
        const HOVER_RADIUS = 30; 
        const MAX_RADIUS_MULTIPLIER = 1.8; 
        const ANIMATION_EASING = 0.15;

        // Smooth Zoom Lerping state
        let currentScale = 1;
        let currentTx = 0;
        let currentTy = 0;

        const VIEW_CONFIGS = {
            world: { center: [11, 15], extents: (w, h) => [[w * 0.02, h * 0.1], [w * 0.98, h * 0.9]] },
            usa: { center: [-96, 38.5], extents: (w, h) => [[w * -0.15, h * 0.02], [w * 1.15, h * 0.98]] },
            germany: { center: [10.45, 51.16], extents: (w, h) => [[w * 0.1, h * 0.05], [w * 0.9, h * 0.95]] }
        };

        async function init() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
                const topo = await response.json();
                const countries = topojson.feature(topo, topo.objects.countries);
                countries.features = countries.features.filter(f => f.id !== "010" && f.properties?.name !== "Antarctica");
                geoData = countries;
                
                window.addEventListener('resize', debounce(setupCanvasAndGenerate, 150));
                
                metricSelector.addEventListener('change', (e) => {
                    currentMetric = e.target.value;
                    loadingEl.classList.remove('hidden');
                    setTimeout(setupCanvasAndGenerate, 50);
                    updateReadout(null);
                });

                zoomToggleBtn.addEventListener('click', () => {
                    autoZoomEnabled = !autoZoomEnabled;
                    zoomToggleBtn.classList.toggle('active', autoZoomEnabled);
                    zoomToggleBtn.innerText = `Auto-Zoom: ${autoZoomEnabled ? 'ON' : 'OFF'}`;
                });

                setupCanvasAndGenerate();
            } catch (err) {
                loadingEl.innerText = "Error loading Map.";
            }
        }

        window.setViewMode = function(mode, btn) {
            if (viewMode === mode) return;
            viewMode = mode;
            document.querySelectorAll('.pill:not(.zoom-toggle)').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadingEl.classList.remove('hidden');
            setTimeout(setupCanvasAndGenerate, 50);
        };

        function setupCanvasAndGenerate() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            if (width <= 0 || height <= 0) { setTimeout(setupCanvasAndGenerate, 100); return; }

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            
            // Reset dynamic zoom
            currentScale = 1;
            currentTx = 0;
            currentTy = 0;

            generateHexMap();
            loadingEl.classList.add('hidden');
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(animate);
        }

        // Guarantees all 50 cities are processed and displayed (no slice limiting)
        function getActiveLocations() {
            let locs = [...CCC_DATA];
            if (viewMode === 'usa') locs = locs.filter(c => c.name.includes("USA"));
            if (viewMode === 'germany') locs = locs.filter(c => c.name.includes("Germany") || c.name.includes("UK") || c.name.includes("Poland") || c.name.includes("France") || c.name.includes("Ireland") || c.name.includes("Spain") || c.name.includes("Italy") || c.name.includes("Russia") || c.name.includes("Hungary"));
            
            // Sort Descending! This guarantees the highest value cities claim dots first so they are NEVER overwritten.
            return locs.sort((a, b) => b[currentMetric] - a[currentMetric]);
        }

        function generateHexMap() {
            dots = [];
            
            const offCanvas = document.createElement('canvas');
            offCanvas.width = width * dpr; offCanvas.height = height * dpr;
            const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
            offCtx.scale(dpr, dpr);

            const activeView = VIEW_CONFIGS[viewMode];
            const projection = d3.geoEquirectangular().center(activeView.center).fitExtent(activeView.extents(width, height), geoData);
            const path = d3.geoPath().projection(projection).context(offCtx);

            offCtx.fillStyle = '#ffffff'; offCtx.beginPath(); path(geoData); offCtx.fill();

            const imgData = offCtx.getImageData(0, 0, width * dpr, height * dpr).data;
            const gridDensity = viewMode === 'world' ? 190 : (viewMode === 'usa' ? 150 : 120);
            const spacing = width / gridDensity;
            const rowHeight = spacing * 0.8660254; 
            const defaultRadius = spacing * 0.28;

            // Generate Map Base
            for (let y = 0; y < height; y += rowHeight) {
                const offsetX = (Math.floor(y / rowHeight) % 2 !== 0) ? spacing / 2 : 0;
                for (let x = offsetX; x < width; x += spacing) {
                    const px = Math.floor(x * dpr); const py = Math.floor(y * dpr);
                    if (px >= width * dpr || py >= height * dpr) continue;
                    const i = (py * Math.floor(width * dpr) + px) * 4;
                    if (imgData[i + 3] > 128) {
                        dots.push({ x: x, y: y, baseR: defaultRadius, r: 0, isCity: false, isNeighbor: false, targetColor: '#334155' });
                    }
                }
            }

            const activeLocations = getActiveLocations();
            
            // Strictly assign cities to prevent overwriting overlaps
            activeLocations.forEach(loc => {
                const coords = projection([loc.lng, loc.lat]);
                if (!coords || coords[0] < 0 || coords[0] > width || coords[1] < 0 || coords[1] > height) return;

                let bestDot = null;
                let minDist = Infinity;
                
                for (let i = 0; i < dots.length; i++) {
                    if (dots[i].isCity) continue; // CRITICAL FIX: skip dots already assigned to a higher-rated city
                    
                    const d = Math.hypot(dots[i].x - coords[0], dots[i].y - coords[1]);
                    if (d < minDist) { minDist = d; bestDot = dots[i]; }
                }

                // If dot is within a reasonable proximity, map it
                if (bestDot && minDist < spacing * 3) {
                    bestDot.isCity = true;
                    bestDot.cityData = loc;
                }
            });

            // Calculate 6 touching neighbor dots
            const cityDots = dots.filter(d => d.isCity);
            cityDots.forEach(cityDot => {
                for (let i = 0; i < dots.length; i++) {
                    const dot = dots[i];
                    if (dot.isCity) continue; 
                    
                    const dist = Math.hypot(dot.x - cityDot.x, dot.y - cityDot.y);
                    if (dist > 0.1 && dist <= spacing * 1.15) {
                        dot.isNeighbor = true;
                        dot.parentCity = cityDot.cityData;
                    }
                }
            });

            recalculateDotStyles(spacing);
        }

        // Relative Scaling ensuring all 50 map accurately
        function recalculateDotStyles(spacing) {
            spacing = spacing || (width / (viewMode === 'world' ? 190 : (viewMode === 'usa' ? 150 : 120)));
            const activeLocations = getActiveLocations();
            
            // True Relative Scale
            const minVal = d3.min(activeLocations, d => d[currentMetric]) || 0;
            const maxVal = d3.max(activeLocations, d => d[currentMetric]) || 1;
            const valRange = maxVal - minVal || 1;

            const defaultR = spacing * 0.28;
            const minCityR = spacing * 0.45; // Lowest value city strictly larger than background
            const maxCityR = spacing * 1.35; // Peak value city
            const adjacentFraction = 0.40;

            for (let i = 0; i < dots.length; i++) {
                const dot = dots[i];
                if (dot.isCity) {
                    const rawRatio = (dot.cityData[currentMetric] - minVal) / valRange;
                    const ratio = Math.max(0, Math.min(1, rawRatio));
                    
                    dot.targetColor = getSpectrumColor(ratio);
                    dot.baseR = minCityR + (maxCityR - minCityR) * ratio;
                } 
                else if (dot.isNeighbor) {
                    const rawRatio = (dot.parentCity[currentMetric] - minVal) / valRange;
                    const ratio = Math.max(0, Math.min(1, rawRatio));
                    
                    dot.targetColor = getSpectrumColor(ratio);
                    const parentCitySize = minCityR + (maxCityR - minCityR) * ratio;
                    dot.baseR = parentCitySize * adjacentFraction;
                } 
                else {
                    dot.targetColor = '#334155';
                    dot.baseR = defaultR;
                }
            }
        }

        // Relative Color Spectrum
        function getSpectrumColor(ratio) {
            ratio = Math.max(0, Math.min(1, ratio));
            if (ratio < 0.25) return interpolateColor('#0284c7', '#34c6f3', ratio / 0.25);
            if (ratio < 0.50) return interpolateColor('#34c6f3', '#d9ff3b', (ratio - 0.25) / 0.25);
            if (ratio < 0.75) return interpolateColor('#d9ff3b', '#ffe45a', (ratio - 0.50) / 0.25);
            return interpolateColor('#ffe45a', '#f46fb0', (ratio - 0.75) / 0.25);
        }

        function interpolateColor(color1, color2, factor) {
            const c1 = parseColor(color1); const c2 = parseColor(color2);
            return `rgb(${Math.round(c1.r + factor * (c2.r - c1.r))}, ${Math.round(c1.g + factor * (c2.g - c1.g))}, ${Math.round(c1.b + factor * (c2.b - c1.b))})`;
        }

        function parseColor(c) {
            const hex = c.slice(1);
            return { r: parseInt(hex.slice(0, 2), 16), g: parseInt(hex.slice(2, 4), 16), b: parseInt(hex.slice(4, 6), 16) };
        }

        function animate() {
            // Transform Math for the dynamic Mouse-Zoom feature
            let targetScale = 1;
            let targetTx = 0;
            let targetTy = 0;

            if (autoZoomEnabled && ScreenMouse.inBounds) {
                targetScale = 2.8; // Deep zoom to mouse proportion
                targetTx = ScreenMouse.x - (ScreenMouse.x * targetScale);
                targetTy = ScreenMouse.y - (ScreenMouse.y * targetScale);
            }

            // Smoothly Lerp Camera Matrix
            currentScale += (targetScale - currentScale) * 0.1;
            currentTx += (targetTx - currentTx) * 0.1;
            currentTy += (targetTy - currentTy) * 0.1;

            // Project screen mouse into logical canvas space for accurate physics 
            if (ScreenMouse.inBounds) {
                MOUSE.x = (ScreenMouse.x - currentTx) / currentScale;
                MOUSE.y = (ScreenMouse.y - currentTy) / currentScale;
            } else {
                MOUSE.x = -1000; MOUSE.y = -1000;
            }

            // Begin Context Transformation
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.scale(dpr, dpr);
            ctx.translate(currentTx, currentTy);
            ctx.scale(currentScale, currentScale);

            const layers = { emptyResting: [], emptyActive: [], neighborResting: {}, neighborActive: [], cityResting: {}, cityActive: [] };
            let hoveredLocationData = null;

            for (let i = 0; i < dots.length; i++) {
                const dot = dots[i];
                const dx = MOUSE.x - dot.x; const dy = MOUSE.y - dot.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                let targetR = dot.baseR; let isActive = false;
                
                // Requested Tactile Sine-Curve Math Logic Restored
                if (dist < HOVER_RADIUS) {
                    isActive = true;
                    targetR = dot.baseR + (dot.baseR * MAX_RADIUS_MULTIPLIER * Math.sin((1 - (dist / HOVER_RADIUS)) * Math.PI / 2));
                    if (dot.isCity) hoveredLocationData = dot.cityData;
                    if (dot.isNeighbor) hoveredLocationData = dot.parentCity;
                }

                dot.r += (targetR - dot.r) * ANIMATION_EASING;
                dot.currentDist = dist;

                const isResting = !isActive && Math.abs(dot.r - dot.baseR) < 0.05;
                if (isResting) dot.r = dot.baseR;

                if (dot.isCity) {
                    if (isResting) {
                        if (!layers.cityResting[dot.targetColor]) layers.cityResting[dot.targetColor] = [];
                        layers.cityResting[dot.targetColor].push(dot);
                    } else layers.cityActive.push(dot);
                } else if (dot.isNeighbor) {
                    if (isResting) {
                        if (!layers.neighborResting[dot.targetColor]) layers.neighborResting[dot.targetColor] = [];
                        layers.neighborResting[dot.targetColor].push(dot);
                    } else layers.neighborActive.push(dot);
                } else {
                    if (isResting) layers.emptyResting.push(dot);
                    else layers.emptyActive.push(dot);
                }
            }

            // DRAWING LOOP
            ctx.fillStyle = '#334155'; ctx.beginPath();
            layers.emptyResting.forEach(d => { ctx.moveTo(d.x+d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); });
            ctx.fill();

            ctx.beginPath();
            layers.emptyActive.forEach(d => { ctx.moveTo(d.x+d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); });
            ctx.fill();

            for (const color in layers.neighborResting) {
                ctx.fillStyle = color; ctx.beginPath();
                layers.neighborResting[color].forEach(d => { ctx.moveTo(d.x+d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); });
                ctx.fill();
            }

            ctx.lineWidth = 0.8 / currentScale; // Protect stroke thickness across camera zooms
            ctx.strokeStyle = '#0284c7';
            layers.neighborActive.forEach(d => {
                ctx.fillStyle = d.targetColor; ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            });

            ctx.lineWidth = 1.0 / currentScale;
            for (const color in layers.cityResting) {
                ctx.fillStyle = color; ctx.beginPath();
                layers.cityResting[color].forEach(d => { ctx.moveTo(d.x+d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); });
                ctx.fill(); ctx.stroke(); 
            }

            layers.cityActive.sort((a, b) => b.currentDist - a.currentDist);
            layers.cityActive.forEach(d => {
                ctx.fillStyle = d.targetColor; ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
            });

            ctx.restore();

            updateReadout(hoveredLocationData);
            animationFrameId = requestAnimationFrame(animate);
        }

        // Detailed Subtitle Bar
        function updateReadout(loc) {
            const metricDisplayNames = { views: "Views", engagedViews: "Engaged Views", avgDurationSec: "Avg. Duration", avgPercent: "Avg. % Viewed", stayed: "Stayed to Watch" };

            if (loc) {
                const nameParts = loc.name.split(',');
                const country = nameParts.pop().trim();
                const cityStr = nameParts.join(', ').trim();

                readoutLabel.innerHTML = `
                    <div class="stats-container">
                        <span style="color:var(--pink); font-size:14px;">📍</span> 
                        <span style="font-weight: 900; color:var(--ink); text-transform:uppercase; font-size: 13px;">${cityStr} <span style="color:var(--dark-blue);">(${country})</span></span>
                        
                        <div style="width: 2px; height: 16px; background: var(--ink); opacity: 0.2; margin: 0 4px;"></div>
                        
                        <span class="stat-item">VIEWS: <span class="stat-val">${loc.views.toLocaleString()}</span></span>
                        <span class="stat-item">ENGAGED: <span class="stat-val">${loc.engagedViews.toLocaleString()}</span></span>
                        <span class="stat-item">AVG DUR: <span class="stat-val">${loc.avgDurationStr}</span></span>
                        <span class="stat-item">VIEWED %: <span class="stat-val">${loc.avgPercent}%</span></span>
                        <span class="stat-item">STAYED %: <span class="stat-val">${loc.stayed}%</span></span>
                    </div>
                    <span class="metric-badge" style="background:var(--lime)">MAP METRIC: ${metricDisplayNames[currentMetric]}</span>
                `;
            } else {
                readoutLabel.innerHTML = `
                    <div class="stats-container">
                        <span style="color: var(--pink); font-size: 14px;">📍</span> 
                        <span style="font-weight: bold; color: var(--ink);">Hover over a colored region on the map to view all localized CCC.csv statistics...</span>
                    </div>
                    <span class="metric-badge">MAP METRIC: ${metricDisplayNames[currentMetric]}</span>
                `;
            }
        }

        // Screen Input Handlers mapping to Logic space
        window.addEventListener('mousemove', (e) => { 
            const r = canvas.getBoundingClientRect(); 
            ScreenMouse.x = e.clientX - r.left; 
            ScreenMouse.y = e.clientY - r.top; 
            ScreenMouse.inBounds = true;
        });
        window.addEventListener('mouseleave', () => { ScreenMouse.inBounds = false; });
        window.addEventListener('touchmove', (e) => { 
            if(e.touches.length > 0) { 
                const r = canvas.getBoundingClientRect(); 
                ScreenMouse.x = e.touches[0].clientX - r.left; 
                ScreenMouse.y = e.touches[0].clientY - r.top; 
                ScreenMouse.inBounds = true;
            } 
        }, { passive: true });
        window.addEventListener('touchend', () => { ScreenMouse.inBounds = false; });
        
        function debounce(func, wait) { let timeout; return (...args) => { clearTimeout(timeout); timeout = setTimeout(() => func(...args), wait); }; }

        init();
    </script>
</body>
</html>
