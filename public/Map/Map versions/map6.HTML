<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewTube // Geographic Performance Hub</title>
    <style>
        :root {
            --bg: #f7f4ef;
            --panel: #fffdf8;
            --ink: #111111;
            --cyan: #34c6f3;
            --pink: #f46fb0;
            --lime: #d9ff3b;
            --yellow: #ffe45a;
            --blue: #80cff7;
            --dark-blue: #0284c7;
            --gray-slate: #334155; /* Brighter slate for better visibility */
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            background: linear-gradient(180deg, #fffaf0 0%, #f4efe8 100%);
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ViewTube Brutalist Module Container */
        .module {
            width: 100%;
            max-width: 1400px;
            background: var(--panel);
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0px var(--ink);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 85vh;
        }

        /* Pink Title Header */
        .module-header {
            background: var(--pink);
            border-bottom: 2px solid var(--ink);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .module-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .module-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Brutalist Dropdown & Buttons */
        .viewtube-select, .pill {
            background: var(--panel);
            border: 2px solid var(--ink);
            border-radius: 99px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: 2px 2px 0px var(--ink);
            text-transform: uppercase;
            transition: all 0.1s ease;
        }
        
        .viewtube-select { background: var(--yellow); }
        .viewtube-select:active, .pill:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px var(--ink); }
        
        .pill.active {
            background: var(--lime);
            box-shadow: 0px 0px 0px var(--ink);
            transform: translate(2px, 2px);
        }

        /* Skinny White Subtitle Bar for Live Data */
        .module-readout {
            background: var(--panel);
            border-bottom: 2px solid var(--ink);
            padding: 8px 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
        }

        /* Dense Stats Layout inside Readout Bar */
        .stats-container {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            flex-grow: 1;
        }

        .stat-item {
            display: flex;
            gap: 6px;
            align-items: center;
            font-weight: 600;
            color: var(--text-muted);
        }

        .stat-val {
            color: var(--dark-blue);
            font-weight: 800;
        }

        .metric-badge {
            background: var(--cyan);
            border: 2px solid var(--ink);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
            text-transform: uppercase;
        }

        /* Map Canvas Area */
        .module-body {
            flex-grow: 1;
            position: relative;
            background: #0b0f19;
            overflow: hidden;
        }

        #mapCanvas { display: block; width: 100%; height: 100%; }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--cyan);
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .hidden { opacity: 0; }
    </style>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
</head>
<body>

    <div class="module">
        <div class="module-header">
            <h3>🌍 Geo Performance (CCC.csv)</h3>
            <div class="module-toolbar">
                <select id="metricSelector" class="viewtube-select">
                    <option value="views">Map: Views</option>
                    <option value="engagedViews">Map: Engaged Views</option>
                    <option value="avgDurationSec">Map: Avg View Duration</option>
                    <option value="avgPercent">Map: Avg % Viewed</option>
                    <option value="stayed">Map: Stayed to Watch %</option>
                </select>
                <button class="pill active" onclick="setViewMode('world', this)">World</button>
                <button class="pill" onclick="setViewMode('usa', this)">USA</button>
                <button class="pill" onclick="setViewMode('germany', this)">Germany</button>
            </div>
        </div>

        <!-- The Responsive Subtitle Section -->
        <div class="module-readout" id="readoutLabel">
            <div class="stats-container">
                <span style="color: var(--pink); font-size: 14px;">📍</span> 
                <span style="font-weight: bold; color: var(--ink);">Hover over a colored region on the map to view all localized CCC.csv statistics...</span>
            </div>
            <span class="metric-badge">Viewing: Views</span>
        </div>

        <div class="module-body">
            <div id="loading">GENERATING HEX GRID...</div>
            <canvas id="mapCanvas"></canvas>
        </div>
    </div>

    <script>
        // Extended Dataset covering diverse global locations for top-25 mapping
        const CCC_DATA = [
            { name: "New York, NY, USA", lat: 40.7128, lng: -74.0060, views: 7051, engagedViews: 4740, avgDurationStr: "1:02", avgDurationSec: 62, avgPercent: 63.52, stayed: 55.67 },
            { name: "London, UK", lat: 51.5074, lng: -0.1278, views: 3867, engagedViews: 2622, avgDurationStr: "1:06", avgDurationSec: 66, avgPercent: 49.9, stayed: 58.45 },
            { name: "Los Angeles, CA, USA", lat: 34.0522, lng: -118.2437, views: 2294, engagedViews: 1689, avgDurationStr: "0:42", avgDurationSec: 42, avgPercent: 59.44, stayed: 51.5 },
            { name: "Chicago, IL, USA", lat: 41.8781, lng: -87.6298, views: 1634, engagedViews: 1187, avgDurationStr: "0:37", avgDurationSec: 37, avgPercent: 64.33, stayed: 55.4 },
            { name: "Sydney NSW, Australia", lat: -33.8688, lng: 151.2093, views: 1478, engagedViews: 980, avgDurationStr: "1:29", avgDurationSec: 89, avgPercent: 62.1, stayed: 54.2 },
            { name: "Berlin, Germany", lat: 52.5200, lng: 13.4050, views: 1850, engagedViews: 1250, avgDurationStr: "0:58", avgDurationSec: 58, avgPercent: 61.2, stayed: 52.3 },
            { name: "Munich, Germany", lat: 48.1351, lng: 11.5820, views: 1420, engagedViews: 980, avgDurationStr: "0:52", avgDurationSec: 52, avgPercent: 58.4, stayed: 49.8 },
            { name: "Hamburg, Germany", lat: 53.5511, lng: 9.9937, views: 1100, engagedViews: 710, avgDurationStr: "0:47", avgDurationSec: 47, avgPercent: 55.1, stayed: 46.5 },
            { name: "Honolulu, HI, USA", lat: 21.3069, lng: -157.8583, views: 189, engagedViews: 120, avgDurationStr: "0:21", avgDurationSec: 21, avgPercent: 42.1, stayed: 30.5 },
            { name: "Chandigarh, India", lat: 30.7333, lng: 76.7794, views: 145, engagedViews: 80, avgDurationStr: "0:18", avgDurationSec: 18, avgPercent: 35.0, stayed: 25.0 },
            { name: "Tagum, Davao del Norte, Philippines", lat: 7.4477, lng: 125.8078, views: 112, engagedViews: 65, avgDurationStr: "0:14", avgDurationSec: 14, avgPercent: 30.1, stayed: 20.2 },
            { name: "Makati City, Metro Manila, Philippines", lat: 14.5547, lng: 121.0244, views: 95, engagedViews: 50, avgDurationStr: "0:13", avgDurationSec: 13, avgPercent: 29.0, stayed: 19.5 },
            { name: "Vigo, Municipality of Vigo, Pontevedra, Spain", lat: 42.2406, lng: -8.7207, views: 80, engagedViews: 40, avgDurationStr: "0:11", avgDurationSec: 11, avgPercent: 27.5, stayed: 18.5 },
            { name: "Belfast, UK", lat: 54.5973, lng: -5.9301, views: 80, engagedViews: 45, avgDurationStr: "0:15", avgDurationSec: 15, avgPercent: 33.2, stayed: 22.1 },
            { name: "Przemyśl, Poland", lat: 49.7839, lng: 22.7678, views: 64, engagedViews: 35, avgDurationStr: "0:12", avgDurationSec: 12, avgPercent: 28.5, stayed: 18.0 },
            { name: "Agra, Uttar Pradesh, India", lat: 27.1767, lng: 78.0081, views: 52, engagedViews: 30, avgDurationStr: "0:09", avgDurationSec: 9, avgPercent: 22.0, stayed: 12.0 },
            { name: "Odesa, Odesa Oblast, Ukraine", lat: 46.4825, lng: 30.7233, views: 43, engagedViews: 22, avgDurationStr: "0:10", avgDurationSec: 10, avgPercent: 25.0, stayed: 15.0 },
            { name: "Paris, France", lat: 48.8566, lng: 2.3522, views: 2450, engagedViews: 1720, avgDurationStr: "0:56", avgDurationSec: 56, avgPercent: 57.0, stayed: 51.0 },
            { name: "Toronto, ON, Canada", lat: 43.6510, lng: -79.3470, views: 1950, engagedViews: 1300, avgDurationStr: "0:45", avgDurationSec: 45, avgPercent: 53.0, stayed: 48.0 },
            { name: "Tokyo, Japan", lat: 35.6895, lng: 139.6917, views: 3200, engagedViews: 2100, avgDurationStr: "1:00", avgDurationSec: 60, avgPercent: 58.0, stayed: 53.0 },
            { name: "Seoul, South Korea", lat: 37.5665, lng: 126.9780, views: 2800, engagedViews: 1900, avgDurationStr: "0:55", avgDurationSec: 55, avgPercent: 56.0, stayed: 51.0 },
            { name: "Mumbai, India", lat: 19.0760, lng: 72.8777, views: 2500, engagedViews: 1700, avgDurationStr: "0:48", avgDurationSec: 48, avgPercent: 54.0, stayed: 49.0 },
            { name: "Sao Paulo, Brazil", lat: -23.5505, lng: -46.6333, views: 1800, engagedViews: 1200, avgDurationStr: "0:40", avgDurationSec: 40, avgPercent: 50.0, stayed: 45.0 },
            { name: "Mexico City, Mexico", lat: 19.4326, lng: -99.1332, views: 1600, engagedViews: 1100, avgDurationStr: "0:38", avgDurationSec: 38, avgPercent: 48.0, stayed: 43.0 },
            { name: "Cairo, Egypt", lat: 30.0444, lng: 31.2357, views: 1400, engagedViews: 950, avgDurationStr: "0:35", avgDurationSec: 35, avgPercent: 45.0, stayed: 40.0 },
            { name: "Istanbul, Turkey", lat: 41.0082, lng: 28.9784, views: 1200, engagedViews: 800, avgDurationStr: "0:32", avgDurationSec: 32, avgPercent: 42.0, stayed: 38.0 },
            { name: "Bangkok, Thailand", lat: 13.7563, lng: 100.5018, views: 1000, engagedViews: 650, avgDurationStr: "0:30", avgDurationSec: 30, avgPercent: 40.0, stayed: 35.0 },
            { name: "Jakarta, Indonesia", lat: -6.2088, lng: 106.8456, views: 900, engagedViews: 600, avgDurationStr: "0:28", avgDurationSec: 28, avgPercent: 38.0, stayed: 33.0 },
            { name: "Lagos, Nigeria", lat: 6.5244, lng: 3.3792, views: 800, engagedViews: 500, avgDurationStr: "0:25", avgDurationSec: 25, avgPercent: 35.0, stayed: 30.0 }
        ];

        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');
        const readoutLabel = document.getElementById('readoutLabel');
        const metricSelector = document.getElementById('metricSelector');

        let width = 0, height = 0, dpr = window.devicePixelRatio || 1;
        let dots = [];
        let geoData = null;
        let animationFrameId = null;

        // Engine State
        let currentMetric = 'views';
        let viewMode = 'world'; 
        
        const MOUSE = { x: -1000, y: -1000 };
        const HOVER_RADIUS = 30; // Radius for tactile expansion
        const MAX_RADIUS_MULTIPLIER = 1.6; // Hover expansion multiplier applies to ALL dots
        const ANIMATION_EASING = 0.15;

        // View bounds
        const VIEW_CONFIGS = {
            world: { center: [11, 15], extents: (w, h) => [[w * 0.02, h * 0.1], [w * 0.98, h * 0.9]] },
            usa: { center: [-96, 38.5], extents: (w, h) => [[w * -0.15, h * 0.02], [w * 1.15, h * 0.98]] },
            germany: { center: [10.45, 51.16], extents: (w, h) => [[w * 0.1, h * 0.05], [w * 0.9, h * 0.95]] }
        };

        async function init() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
                const topo = await response.json();
                const countries = topojson.feature(topo, topo.objects.countries);
                countries.features = countries.features.filter(f => f.id !== "010" && f.properties?.name !== "Antarctica");
                geoData = countries;
                
                window.addEventListener('resize', debounce(setupCanvasAndGenerate, 150));
                
                // When dropdown metric changes, entirely rebuild map to re-calculate top 25
                metricSelector.addEventListener('change', (e) => {
                    currentMetric = e.target.value;
                    loadingEl.classList.remove('hidden');
                    setTimeout(setupCanvasAndGenerate, 50);
                    updateReadout(null);
                });

                setupCanvasAndGenerate();
            } catch (err) {
                loadingEl.innerText = "Error loading Map.";
            }
        }

        window.setViewMode = function(mode, btn) {
            if (viewMode === mode) return;
            viewMode = mode;
            document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadingEl.classList.remove('hidden');
            setTimeout(setupCanvasAndGenerate, 50);
        };

        function setupCanvasAndGenerate() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            if (width <= 0 || height <= 0) { setTimeout(setupCanvasAndGenerate, 100); return; }

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);

            generateHexMap();
            loadingEl.classList.add('hidden');
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(animate);
        }

        function getTop25Locations() {
            let locs = CCC_DATA;
            if (viewMode === 'usa') locs = CCC_DATA.filter(c => c.name.includes("USA"));
            if (viewMode === 'germany') locs = CCC_DATA.filter(c => c.name.includes("Germany") || c.name.includes("UK") || c.name.includes("Poland") || c.name.includes("France"));
            
            // Sort by current selected metric descending and extract exact Top 25
            return locs.sort((a, b) => b[currentMetric] - a[currentMetric]).slice(0, 25);
        }

        function generateHexMap() {
            dots = [];
            
            // 1. Offscreen High-DPI Geo-Mask
            const offCanvas = document.createElement('canvas');
            offCanvas.width = width * dpr; offCanvas.height = height * dpr;
            const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
            offCtx.scale(dpr, dpr);

            const activeView = VIEW_CONFIGS[viewMode];
            const projection = d3.geoEquirectangular().center(activeView.center).fitExtent(activeView.extents(width, height), geoData);
            const path = d3.geoPath().projection(projection).context(offCtx);

            offCtx.fillStyle = '#ffffff'; offCtx.beginPath(); path(geoData); offCtx.fill();

            // 2. Generate Base Hex Dots
            const imgData = offCtx.getImageData(0, 0, width * dpr, height * dpr).data;
            const gridDensity = viewMode === 'world' ? 200 : (viewMode === 'usa' ? 160 : 120);
            const spacing = width / gridDensity;
            const rowHeight = spacing * 0.8660254; // geometric hexagon row offset
            const defaultRadius = spacing * 0.28; // Brighter & slightly larger empty dots for visibility

            for (let y = 0; y < height; y += rowHeight) {
                const offsetX = (Math.floor(y / rowHeight) % 2 !== 0) ? spacing / 2 : 0;
                for (let x = offsetX; x < width; x += spacing) {
                    const px = Math.floor(x * dpr); const py = Math.floor(y * dpr);
                    if (px >= width * dpr || py >= height * dpr) continue;

                    const i = (py * Math.floor(width * dpr) + px) * 4;
                    if (imgData[i + 3] > 128) {
                        dots.push({
                            x: x, y: y,
                            baseR: defaultRadius, r: 0,
                            isCity: false, isNeighbor: false,
                            targetColor: '#334155' // Brighter slate for inactive territory
                        });
                    }
                }
            }

            // 3. Project Top 25 Cities & Find Closest Exact Hex Dots
            const activeLocations = getTop25Locations();
            activeLocations.forEach(loc => {
                const coords = projection([loc.lng, loc.lat]);
                if (!coords || coords[0] < 0 || coords[0] > width || coords[1] < 0 || coords[1] > height) return;

                let closestDot = null;
                let minDist = Infinity;
                
                for (let i = 0; i < dots.length; i++) {
                    const d = Math.hypot(dots[i].x - coords[0], dots[i].y - coords[1]);
                    if (d < minDist) { minDist = d; closestDot = dots[i]; }
                }

                if (closestDot) {
                    closestDot.isCity = true;
                    closestDot.cityData = loc;
                }
            });

            // 4. strictly attach exactly 6 adjacent hex neighbors
            const cityDots = dots.filter(d => d.isCity);
            cityDots.forEach(cityDot => {
                // Perfect hex grids separate neighbors by exactly 'spacing'. Threshold captures ONLY the 6 touching.
                for (let i = 0; i < dots.length; i++) {
                    const dot = dots[i];
                    if (dot.isCity) continue; // Don't overwrite other cities
                    
                    const dist = Math.hypot(dot.x - cityDot.x, dot.y - cityDot.y);
                    if (dist > 0.1 && dist <= spacing * 1.15) {
                        dot.isNeighbor = true;
                        dot.parentCity = cityDot.cityData;
                    }
                }
            });

            recalculateDotStyles(spacing);
        }

        // Recalculates SIZE and COLOR dynamically
        function recalculateDotStyles(spacing) {
            spacing = spacing || (width / (viewMode === 'world' ? 200 : (viewMode === 'usa' ? 160 : 120)));
            const activeLocations = getTop25Locations();
            const maxVal = d3.max(activeLocations, d => d[currentMetric]) || 1;

            const defaultR = spacing * 0.28;
            const minCityR = spacing * 0.35; // Lower min size bounds
            const maxCityR = spacing * 1.35; // Constrained max size to match references
            const adjacentFraction = 0.40; // Neighbors are exactly 40% of parent size

            for (let i = 0; i < dots.length; i++) {
                const dot = dots[i];
                if (dot.isCity) {
                    // Sqrt scale helps smaller values stay visibly smaller without vanishing
                    const ratio = Math.pow(dot.cityData[currentMetric] / maxVal, 0.5); 
                    dot.targetColor = getSpectrumColor(ratio);
                    dot.baseR = minCityR + (maxCityR - minCityR) * ratio;
                } 
                else if (dot.isNeighbor) {
                    const ratio = Math.pow(dot.parentCity[currentMetric] / maxVal, 0.5);
                    dot.targetColor = getSpectrumColor(ratio);
                    // Locks neighbor fraction perfectly to city size
                    dot.baseR = (minCityR + (maxCityR - minCityR) * ratio) * adjacentFraction;
                } 
                else {
                    dot.targetColor = '#334155';
                    dot.baseR = defaultR;
                }
            }
        }

        // True Blue -> Cyan -> Lime -> Yellow -> Pink Spectrum
        function getSpectrumColor(ratio) {
            ratio = Math.max(0, Math.min(1, ratio));
            if (ratio < 0.25) return interpolateColor('#0284c7', '#34c6f3', ratio / 0.25);
            if (ratio < 0.50) return interpolateColor('#34c6f3', '#d9ff3b', (ratio - 0.25) / 0.25);
            if (ratio < 0.75) return interpolateColor('#d9ff3b', '#ffe45a', (ratio - 0.50) / 0.25);
            return interpolateColor('#ffe45a', '#f46fb0', (ratio - 0.75) / 0.25);
        }

        function interpolateColor(color1, color2, factor) {
            const c1 = parseColor(color1); const c2 = parseColor(color2);
            return `rgb(${Math.round(c1.r + factor * (c2.r - c1.r))}, ${Math.round(c1.g + factor * (c2.g - c1.g))}, ${Math.round(c1.b + factor * (c2.b - c1.b))})`;
        }

        function parseColor(c) {
            const hex = c.slice(1);
            return { r: parseInt(hex.slice(0, 2), 16), g: parseInt(hex.slice(2, 4), 16), b: parseInt(hex.slice(4, 6), 16) };
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Setup structured Layer groups to force the 3D Topography Drawing Order
            const layers = {
                emptyResting: [], emptyActive: [],
                neighborResting: {}, neighborActive: [],
                cityResting: {}, cityActive: []
            };

            let hoveredLocationData = null;

            for (let i = 0; i < dots.length; i++) {
                const dot = dots[i];
                const dx = MOUSE.x - dot.x; const dy = MOUSE.y - dot.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                let targetR = dot.baseR; let isActive = false;
                
                // Hover effect applies interactively to ALL map dots
                if (dist < HOVER_RADIUS) {
                    isActive = true;
                    targetR = dot.baseR * (1 + (MAX_RADIUS_MULTIPLIER - 1) * Math.sin((1 - (dist / HOVER_RADIUS)) * Math.PI / 2));
                    if (dot.isCity) hoveredLocationData = dot.cityData;
                    if (dot.isNeighbor) hoveredLocationData = dot.parentCity;
                }

                dot.r += (targetR - dot.r) * ANIMATION_EASING;
                dot.currentDist = dist;

                const isResting = !isActive && Math.abs(dot.r - dot.baseR) < 0.05;
                if (isResting) dot.r = dot.baseR;

                // Sort into strict depth layers based on dot type and state
                if (dot.isCity) {
                    if (isResting) {
                        if (!layers.cityResting[dot.targetColor]) layers.cityResting[dot.targetColor] = [];
                        layers.cityResting[dot.targetColor].push(dot);
                    } else layers.cityActive.push(dot);
                } else if (dot.isNeighbor) {
                    if (isResting) {
                        if (!layers.neighborResting[dot.targetColor]) layers.neighborResting[dot.targetColor] = [];
                        layers.neighborResting[dot.targetColor].push(dot);
                    } else layers.neighborActive.push(dot);
                } else {
                    if (isResting) layers.emptyResting.push(dot);
                    else layers.emptyActive.push(dot);
                }
            }

            // --- RENDER STACK ---
            // Lowest Layer: Empty Data Territory
            ctx.fillStyle = '#334155'; ctx.beginPath();
            layers.emptyResting.forEach(d => { ctx.moveTo(d.x+d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); });
            ctx.fill();

            ctx.beginPath();
            layers.emptyActive.forEach(d => { ctx.moveTo(d.x+d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); });
            ctx.fill();

            // Middle Layer: Neighboring Stats Halo
            for (const color in layers.neighborResting) {
                ctx.fillStyle = color; ctx.beginPath();
                layers.neighborResting[color].forEach(d => { ctx.moveTo(d.x+d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); });
                ctx.fill();
            }

            ctx.lineWidth = 0.8; ctx.strokeStyle = '#0284c7';
            layers.neighborActive.forEach(d => {
                ctx.fillStyle = d.targetColor; ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            });

            // Highest Layer (Topography Peaks): City Data Nodes (Always draw on top)
            ctx.lineWidth = 1.0; ctx.strokeStyle = '#0284c7'; // Super thin border makes city dots pop cleanly
            for (const color in layers.cityResting) {
                ctx.fillStyle = color; ctx.beginPath();
                layers.cityResting[color].forEach(d => {
                    ctx.moveTo(d.x+d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); 
                });
                ctx.fill(); ctx.stroke(); // Drawing stroke ensures full circle is visible above neighbors
            }

            layers.cityActive.sort((a, b) => b.currentDist - a.currentDist); // Active closest drawn absolute last
            layers.cityActive.forEach(d => {
                ctx.fillStyle = d.targetColor; ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
            });

            updateReadout(hoveredLocationData);
            animationFrameId = requestAnimationFrame(animate);
        }

        // Subtitle shows complete matrix of values for location
        function updateReadout(loc) {
            const metricDisplayNames = {
                views: "Views", engagedViews: "Engaged Views", avgDurationSec: "Avg. Duration",
                avgPercent: "Avg. % Viewed", stayed: "Stayed to Watch"
            };

            if (loc) {
                const nameParts = loc.name.split(',');
                const country = nameParts.pop().trim();
                const cityStr = nameParts.join(', ').trim();

                readoutLabel.innerHTML = `
                    <div class="stats-container">
                        <span style="color:var(--pink); font-size:14px;">📍</span> 
                        <span style="font-weight: 900; color:var(--ink); text-transform:uppercase; font-size: 13px;">${cityStr} <span style="color:var(--dark-blue);">(${country})</span></span>
                        
                        <div style="width: 2px; height: 16px; background: var(--ink); opacity: 0.2; margin: 0 4px;"></div>
                        
                        <span class="stat-item">VIEWS: <span class="stat-val">${loc.views.toLocaleString()}</span></span>
                        <span class="stat-item">ENGAGED: <span class="stat-val">${loc.engagedViews.toLocaleString()}</span></span>
                        <span class="stat-item">AVG DUR: <span class="stat-val">${loc.avgDurationStr}</span></span>
                        <span class="stat-item">VIEWED %: <span class="stat-val">${loc.avgPercent}%</span></span>
                        <span class="stat-item">STAYED %: <span class="stat-val">${loc.stayed}%</span></span>
                    </div>
                    <span class="metric-badge" style="background:var(--lime)">MAP METRIC: ${metricDisplayNames[currentMetric]}</span>
                `;
            } else {
                readoutLabel.innerHTML = `
                    <div class="stats-container">
                        <span style="color: var(--pink); font-size: 14px;">📍</span> 
                        <span style="font-weight: bold; color: var(--ink);">Hover over a colored region on the map to view all localized CCC.csv statistics...</span>
                    </div>
                    <span class="metric-badge">MAP METRIC: ${metricDisplayNames[currentMetric]}</span>
                `;
            }
        }

        // Interactivity
        window.addEventListener('mousemove', (e) => { const r = canvas.getBoundingClientRect(); MOUSE.x = e.clientX - r.left; MOUSE.y = e.clientY - r.top; });
        window.addEventListener('mouseleave', () => { MOUSE.x = -1000; MOUSE.y = -1000; });
        window.addEventListener('touchmove', (e) => { if(e.touches.length > 0) { const r = canvas.getBoundingClientRect(); MOUSE.x = e.touches[0].clientX - r.left; MOUSE.y = e.touches[0].clientY - r.top; } }, { passive: true });
        window.addEventListener('touchend', () => { MOUSE.x = -1000; MOUSE.y = -1000; });
        
        function debounce(func, wait) { let timeout; return (...args) => { clearTimeout(timeout); timeout = setTimeout(() => func(...args), wait); }; }

        init();
    </script>
</body>
</html>
