    <style>
        :root {
            --bg: #f7f4ef;
            --panel: #fffdf8;
            --ink: #111111;
            --cyan: #34c6f3;
            --pink: #f46fb0;
            --lime: #d9ff3b;
            --yellow: #ffe45a;
            --blue: #80cff7;
            --dark-blue: #0284c7;
            --gray-slate: #212936; /* Clean dark gray unactivated dots */
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            background: linear-gradient(180deg, #fffaf0 0%, #f4efe8 100%);
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .module {
            width: 100%;
            max-width: 1400px;
            background: var(--panel);
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0px var(--ink);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 85vh;
        }

        .module-header {
            background: var(--pink);
            border-bottom: 2px solid var(--ink);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .module-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .module-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .viewtube-select, .pill {
            background: var(--panel);
            border: 2px solid var(--ink);
            border-radius: 99px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: 2px 2px 0px var(--ink);
            text-transform: uppercase;
            transition: all 0.1s ease;
        }
        
        .viewtube-select { background: var(--yellow); }
        .viewtube-select:active, .pill:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px var(--ink); }
        
        .pill.active {
            background: var(--lime);
            box-shadow: 0px 0px 0px var(--ink);
            transform: translate(2px, 2px);
        }

        .pill.zoom-toggle {
            background: var(--cyan);
            border-color: var(--ink);
        }
        .pill.zoom-toggle.active {
            background: var(--pink);
            color: #fff;
        }

        .module-readout {
            background: var(--panel);
            border-bottom: 2px solid var(--ink);
            padding: 8px 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
            position: relative;
            z-index: 20;
        }

        .stats-container {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            flex-grow: 1;
        }

        .stat-item {
            display: flex;
            gap: 6px;
            align-items: center;
            font-weight: 600;
            color: var(--text-muted);
        }

        .stat-val {
            color: var(--dark-blue);
            font-weight: 800;
        }

        .metric-badge {
            background: var(--cyan);
            border: 2px solid var(--ink);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .module-body {
            flex-grow: 1;
            position: relative;
            background: #0b0f19;
            overflow: hidden;
            cursor: crosshair;
        }

        #mapCanvas { display: block; width: 100%; height: 100%; }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--cyan);
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .hidden { opacity: 0; }
    </style>

        let width = 0, height = 0, dpr = window.devicePixelRatio || 1;
        let dots = [];
        let geoData = null;
        let animationFrameId = null;

        let currentMetric = 'views';
        let viewMode = 'world'; 
        
        // Advanced Auto-Zoom D3 Camera State
        let autoZoomEnabled = false;
        let autoZoomCol = 1; // 0=Americas, 1=Euro/Africa, 2=Asia/Oceania
        let autoZoomRow = 0; // 0=North, 1=South
        let lastZoomSwitch = 0;

        let baseWorldScale = 1;
        let currentProjScale = 1;
        let currentProjCenter = [11, 15];
        let targetProjScale = 1;
        let targetProjCenter = [11, 15];
        let isAnimatingCamera = false;

        const ScreenMouse = { x: -1000, y: -1000, inBounds: false };
        let HOVER_RADIUS = 0;
        const ANIMATION_EASING = 0.15;

        // Dynamic 6-Region Geography Map (Zoomed closer as requested)
        const AUTO_ZOOM_REGIONS = [
            [ // Northern Hemisphere
                { label: 'North America', center: [-98, 42] },
                { label: 'Europe', center: [12, 51] },
                { label: 'Asia', center: [95, 36] }
            ],
            [ // Southern Hemisphere
                { label: 'South America', center: [-60, -18] },
                { label: 'Africa', center: [20, -2] },
                { label: 'Oceania / Philippines', center: [130, -20] }
            ]
        ];

        async function init() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
                const topo = await response.json();
                const countries = topojson.feature(topo, topo.objects.countries);
                countries.features = countries.features.filter(f => f.id !== "010" && f.properties?.name !== "Antarctica");
                geoData = countries;
                
                window.addEventListener('resize', debounce(setupCanvasAndGenerate, 150));
                
                metricSelector.addEventListener('change', (e) => {
                    currentMetric = e.target.value;
                    triggerRegeneration();
                });

                zoomToggleBtn.addEventListener('click', () => {
                    autoZoomEnabled = !autoZoomEnabled;
                    zoomToggleBtn.classList.toggle('active', autoZoomEnabled);
                    
                    if (autoZoomEnabled) {
                        zoomToggleBtn.innerText = `Auto-Zoom: ${AUTO_ZOOM_REGIONS[autoZoomRow][autoZoomCol].label}`;
                    } else {
                        zoomToggleBtn.innerText = `Auto-Zoom: OFF`;
                    }
                    triggerRegeneration();
                });

                setupCanvasAndGenerate();
            } catch (err) {
                loadingEl.innerText = "Error loading Map.";
            }
        }

        window.setViewMode = function(mode, btn) {
            if (viewMode === mode && !autoZoomEnabled) return;
            viewMode = mode;
            autoZoomEnabled = false;
            zoomToggleBtn.classList.remove('active');
            zoomToggleBtn.innerText = `Auto-Zoom: OFF`;
            document.querySelectorAll('.pill:not(.zoom-toggle)').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            triggerRegeneration();
        };

        function triggerRegeneration() {
            loadingEl.classList.remove('hidden');
            setTimeout(() => {
                updateTargetCamera();
                if(!isAnimatingCamera) generateHexMap(targetProjCenter, targetProjScale);
                loadingEl.classList.add('hidden');
                updateReadout(null);
            }, 50);
        }

        function setupCanvasAndGenerate() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            if (width <= 0 || height <= 0) { setTimeout(setupCanvasAndGenerate, 100); return; }

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            const tempProj = d3.geoEquirectangular().fitExtent([[width * 0.02, height * 0.1], [width * 0.98, height * 0.9]], geoData);
            baseWorldScale = tempProj.scale();
            
            updateTargetCamera();
            currentProjScale = targetProjScale;
            currentProjCenter = [...targetProjCenter];

            generateHexMap(currentProjCenter, currentProjScale);
            loadingEl.classList.add('hidden');
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(animate);
        }

        function updateTargetCamera() {
            if (autoZoomEnabled) {
                targetProjScale = baseWorldScale * 3.5; // Zoomed closer to six regions
                targetProjCenter = AUTO_ZOOM_REGIONS[autoZoomRow][autoZoomCol].center;
            } else {
                targetProjScale = baseWorldScale;
                targetProjCenter = [11, 15];
            }
        }

        function getActiveLocations() {
            return [...CCC_DATA].sort((a, b) => b[currentMetric] - a[currentMetric]);
        }

        function generateHexMap(center, scale) {
            dots = [];
            
            const offCanvas = document.createElement('canvas');
            offCanvas.width = width; offCanvas.height = height;
            const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

            const projection = d3.geoEquirectangular().center(center).scale(scale).translate([width / 2, height / 2]);
            const path = d3.geoPath().projection(projection).context(offCtx);

            offCtx.fillStyle = '#ffffff'; offCtx.beginPath(); path(geoData); offCtx.fill();
            const imgData = offCtx.getImageData(0, 0, width, height).data;
            
            // Grid density set to 300 for smaller dots and much higher density
            const gridDensity = 300; 
            const spacing = width / gridDensity;
            const rowHeight = spacing * 0.8660254; 
            
            // Mouse hover radius set to spacing * 5.0 to give plenty of localized ripple area
            HOVER_RADIUS = spacing * 5.0; 
            const defaultRadius = spacing * 0.28;

            const hexGrid = [];

            // 1. Build the perfect honeycomb grid array strictly
            for (let y = 0; y < height; y += rowHeight) {
                const offsetX = (Math.floor(y / rowHeight) % 2 !== 0) ? spacing / 2 : 0;
                for (let x = offsetX; x < width; x += spacing) {
                    const px = Math.floor(x); const py = Math.floor(y);
                    if (px >= width || py >= height) continue;
                    
                    if (imgData[(py * width + px) * 4 + 3] > 128) {
                        hexGrid.push({ 
                            x: x, y: y, 
                            defaultR: defaultRadius, r: defaultRadius, 
                            isCity: false, isNeighbor: false,
                            targetColor: '#212936' // Unactivated dark gray base as requested
                        });
                    }
                }
            }

            // 2. SNAPPING LOGIC: Map the 50 cities perfectly to the existing grid so they never misalign
            const activeLocations = getActiveLocations();
            const minVal = d3.min(activeLocations, d => d[currentMetric]) || 0;
            const maxVal = d3.max(activeLocations, d => d[currentMetric]) || 1;
            const valRange = maxVal - minVal || 1;
            
            // Sizing metrics from Map 11 style
            const minCityR = spacing * 0.55; 
            const maxCityR = spacing * 1.6;

            activeLocations.forEach(loc => {
                const coords = projection([loc.lng, loc.lat]);
                if (!coords || coords[0] < 0 || coords[0] > width || coords[1] < 0 || coords[1] > height) return;

                let closestDot = null;
                let minDist = Infinity;
                
                for (let i = 0; i < hexGrid.length; i++) {
                    if (hexGrid[i].isCity) continue; 
                    const d = Math.hypot(hexGrid[i].x - coords[0], hexGrid[i].y - coords[1]);
                    if (d < minDist) { minDist = d; closestDot = hexGrid[i]; }
                }

                if (closestDot && minDist < spacing * 3) {
                    closestDot.isCity = true;
                    closestDot.cityData = loc;
                    
                    let rawRatio = (loc[currentMetric] - minVal) / valRange;
                    let ratio = Math.pow(Math.max(0, Math.min(1, rawRatio)), 0.45);
                    closestDot.statColor = getSpectrumColor(ratio);
                    closestDot.statR = minCityR + (maxCityR - minCityR) * ratio;
                }
            });

            // 3. Claim the 6 perfect adjacent honeycomb dots to form the hover topography
            const cityDots = hexGrid.filter(d => d.isCity);
            cityDots.forEach(cityDot => {
                for (let i = 0; i < hexGrid.length; i++) {
                    const dot = hexGrid[i];
                    if (dot.isCity) continue; 
                    
                    const dist = Math.hypot(dot.x - cityDot.x, dot.y - cityDot.y);
                    if (dist > 0.1 && dist <= spacing * 1.15) { 
                        dot.isNeighbor = true;
                        dot.parentCityNode = cityDot;
                        dot.statR = cityDot.statR * 0.45; // Neighbor topography drops to 45% of peak
                    }
                }
            });

            dots = hexGrid;
        }

        // Pure mathematical Blue -> Cyan -> Lime -> Yellow -> Pink Spectrum
        function getSpectrumColor(ratio) {
            ratio = Math.max(0, Math.min(1, ratio));
            if (ratio < 0.25) return interpolateColor('#0284c7', '#34c6f3', ratio / 0.25);
            if (ratio < 0.50) return interpolateColor('#34c6f3', '#d9ff3b', (ratio - 0.25) / 0.25);
            if (ratio < 0.75) return interpolateColor('#d9ff3b', '#ffe45a', (ratio - 0.50) / 0.25);
            return interpolateColor('#ffe45a', '#f46fb0', (ratio - 0.75) / 0.25);
        }

        function interpolateColor(color1, color2, factor) {
            const c1 = parseColor(color1); const c2 = parseColor(color2);
            return `rgb(${Math.round(c1.r + factor * (c2.r - c1.r))}, ${Math.round(c1.g + factor * (c2.g - c1.g))}, ${Math.round(c1.b + factor * (c2.b - c1.b))})`;
        }

        function parseColor(c) {
            const hex = c.slice(1);
            return { r: parseInt(hex.slice(0, 2), 16), g: parseInt(hex.slice(2, 4), 16), b: parseInt(hex.slice(4, 6), 16) };
        }

        function getDarkerColor(color) {
            const parsed = parseColor(color);
            return `rgb(${Math.round(parsed.r * 0.55)}, ${Math.round(parsed.g * 0.55)}, ${Math.round(parsed.b * 0.55)})`;
        }

        function animate() {
            // --- STRICT 10% EDGE-TRIGGERED AUTO-ZOOM LOGIC ---
            if (autoZoomEnabled && ScreenMouse.inBounds && Date.now() - lastZoomSwitch > 800) {
                const edgeX = width * 0.10; // 10% edge triggers
                const edgeY = height * 0.10;
                let changed = false;

                if (ScreenMouse.x < edgeX && autoZoomCol > 0) { autoZoomCol--; changed = true; }
                else if (ScreenMouse.x > width - edgeX && autoZoomCol < 2) { autoZoomCol++; changed = true; }
                
                if (ScreenMouse.y < edgeY && autoZoomRow > 0) { autoZoomRow--; changed = true; }
                else if (ScreenMouse.y > height - edgeY && autoZoomRow < 1) { autoZoomRow++; changed = true; }

                if (changed) {
                    lastZoomSwitch = Date.now();
                    updateTargetCamera();
                    zoomToggleBtn.innerText = `Auto-Zoom: ${AUTO_ZOOM_REGIONS[autoZoomRow][autoZoomCol].label}`;
                }
            }

            // --- SMOOTH CINEMATIC CAMERA GLIDE ---
            // If the target camera differs, slowly lerp towards it and regenerate the map
            const diffScale = Math.abs(targetProjScale - currentProjScale);
            const diffCenterX = Math.abs(targetProjCenter[0] - currentProjCenter[0]);
            const diffCenterY = Math.abs(targetProjCenter[1] - currentProjCenter[1]);

            if (diffScale > 0.5 || diffCenterX > 0.5 || diffCenterY > 0.5) {
                isAnimatingCamera = true;
                const smoothLerpFactor = 0.035; // Slower, extremely smooth glide
                currentProjScale += (targetProjScale - currentProjScale) * smoothLerpFactor;
                currentProjCenter[0] += (targetProjCenter[0] - currentProjCenter[0]) * smoothLerpFactor;
                currentProjCenter[1] += (targetProjCenter[1] - currentProjCenter[1]) * smoothLerpFactor;
                generateHexMap(currentProjCenter, currentProjScale);
            } else {
                isAnimatingCamera = false;
            }

            ctx.clearRect(0, 0, width, height);

            const layers = { empty: [], neighbor: [], city: [] };
            let hoveredLocationData = null;

            for (let i = 0; i < dots.length; i++) {
                const dot = dots[i];
                
                let drawColor = '#212936'; // Default dark gray base
                let targetR = dot.defaultR; // Default uniform sizing
                let borderStrokeColor = null;
                
                // Cities permanently claim their relative spectrum colors
                if (dot.isCity) drawColor = dot.statColor;

                // Mouse interaction physics (active when camera is stationary)
                if (!isAnimatingCamera && ScreenMouse.inBounds) {
                    const dx = ScreenMouse.x - dot.x; 
                    const dy = ScreenMouse.y - dot.y;
                    const screenDist = Math.sqrt(dx * dx + dy * dy);

                    if (screenDist < HOVER_RADIUS) {
                        let influence = Math.sin((1 - (screenDist / HOVER_RADIUS)) * Math.PI / 2);
                        
                        if (dot.isCity) {
                            // Growing to statistic size with full spectrum color
                            targetR = dot.defaultR + (dot.statR - dot.defaultR) * influence;
                            borderStrokeColor = getDarkerColor(dot.statColor);
                            hoveredLocationData = dot.cityData;
                        } else if (dot.isNeighbor) {
                            // Neighbor inherits topography proportional scaling and color blooming
                            targetR = dot.defaultR + (dot.statR - dot.defaultR) * influence;
                            drawColor = interpolateColor('#212936', dot.parentCityNode.statColor, Math.min(1, influence * 1.5));
                            borderStrokeColor = getDarkerColor(dot.parentCityNode.statColor);
                            hoveredLocationData = dot.parentCityNode.cityData;
                        } else {
                            // Non-statistic dots swell and change to a brighter gradient blue
                            targetR = dot.defaultR + (dot.defaultR * 1.4 - dot.defaultR) * influence;
                            drawColor = interpolateColor('#212936', '#34c6f3', Math.min(1, influence * 1.2));
                        }
                    }
                }

                dot.r += (targetR - dot.r) * ANIMATION_EASING;

                const rDot = { x: dot.x, y: dot.y, r: dot.r, color: drawColor, strokeColor: borderStrokeColor };
                if (dot.isCity) layers.city.push(rDot);
                else if (dot.isNeighbor) layers.neighbor.push(rDot);
                else layers.empty.push(rDot);
            }

            // --- Z-INDEX RENDER PIPELINE ---
            
            // 1. Lowest Layer: Empty/Inactive Dots (No borders)
            ctx.beginPath();
            layers.empty.forEach(d => { ctx.fillStyle = d.color; ctx.moveTo(d.x+d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); });
            ctx.fill();

            // 2. Middle Layer: Topographic Neighbor Halos
            layers.neighbor.forEach(d => {
                ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill(); 
                if (d.strokeColor && d.r > d.defaultR + 0.5) {
                    ctx.lineWidth = 0.8; ctx.strokeStyle = d.strokeColor; ctx.stroke();
                }
            });

            // 3. Highest Layer: Active City Targets (Pop proudly over grid with thin dark custom border)
            layers.city.sort((a, b) => a.r - b.r); 
            layers.city.forEach(d => {
                ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill(); 
                if (d.strokeColor) {
                    ctx.lineWidth = 1.0; ctx.strokeStyle = d.strokeColor; ctx.stroke();
                } else {
                    ctx.lineWidth = 0.8; ctx.strokeStyle = getDarkerColor(d.color); ctx.stroke();
                }
            });

            updateReadout(hoveredLocationData);
            animationFrameId = requestAnimationFrame(animate);
        }

        function updateReadout(loc) {
            const metricDisplayNames = { views: "Views", engagedViews: "Engaged Views", avgPercent: "Avg. % Viewed", stayed: "Stayed to Watch", watchTime: "Watch Time (Hrs)" };

            if (loc) {
                const nameParts = loc.name.split(',');
                const country = nameParts.pop().trim();
                const cityStr = nameParts.join(', ').trim();

                readoutLabel.innerHTML = `
                    <div class="stats-container">
                        <span style="color:var(--pink); font-size:14px;">📍</span> 
                        <span style="font-weight: 900; color:var(--ink); text-transform:uppercase; font-size: 13px;">${cityStr} <span style="color:var(--dark-blue);">(${country})</span></span>
                        <div style="width: 2px; height: 16px; background: var(--ink); opacity: 0.2; margin: 0 4px;"></div>
                        <span class="stat-item">VIEWS: <span class="stat-val">${loc.views.toLocaleString()}</span></span>
                        <span class="stat-item">ENGAGED: <span class="stat-val">${loc.engagedViews.toLocaleString()}</span></span>
                        <span class="stat-item">AVG DUR: <span class="stat-val">${loc.avgDurationStr}</span></span>
                        <span class="stat-item">VIEWED %: <span class="stat-val">${loc.avgPercent}%</span></span>
                        <span class="stat-item">STAYED %: <span class="stat-val">${loc.stayed}%</span></span>
                    </div>
                    <span class="metric-badge" style="background:var(--lime)">MAP METRIC: ${metricDisplayNames[currentMetric]}</span>
                `;
            } else {
                readoutLabel.innerHTML = `
                    <div class="stats-container">
                        <span style="color: var(--pink); font-size: 14px;">📍</span> 
                        <span style="font-weight: bold; color: var(--ink);">Hover over a colored city on the map to expand its local data topography...</span>
                    </div>
                    <span class="metric-badge">MAP METRIC: ${metricDisplayNames[currentMetric]}</span>
                `;
            }
        }

        window.addEventListener('mousemove', (e) => { 
            const r = canvas.getBoundingClientRect(); 
            ScreenMouse.x = e.clientX - r.left; 
            ScreenMouse.y = e.clientY - r.top; 
            ScreenMouse.inBounds = true;
        });
        window.addEventListener('mouseleave', () => { ScreenMouse.inBounds = false; });
        window.addEventListener('touchmove', (e) => { 
            if(e.touches.length > 0) { 
                const r = canvas.getBoundingClientRect(); 
                ScreenMouse.x = e.touches[0].clientX - r.left; 
                ScreenMouse.y = e.touches[0].clientY - r.top; 
                ScreenMouse.inBounds = true;
            } 
        }, { passive: true });
        window.addEventListener('touchend', () => { ScreenMouse.inBounds = false; });
        function debounce(func, wait) { let timeout; return (...args) => { clearTimeout(timeout); timeout = setTimeout(() => func(...args), wait); }; }

        init();
    </script>
</body>
</html>
