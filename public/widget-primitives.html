<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ViewTube Widget Primitives</title><style>:root{--a:#34cdea;--ink:#171717;--bg:#f7f7f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;font-weight:750}.page{padding:12px;max-width:1400px;margin:auto}.card{background:#fff;border:3px solid var(--ink);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:6px 6px 0 color-mix(in srgb,var(--a) 50%,transparent)}header{padding:12px;background:var(--a);border-bottom:3px solid var(--ink)}h1,h2,p{margin:0}h1{font-size:20px;font-weight:950}h2{font-size:16px;font-weight:950}.sub{font-size:10px}.body{padding:12px}.palette{display:flex;gap:7px;flex-wrap:wrap}.sw{width:38px;height:30px;border:2px solid #111;border-radius:6px;background:var(--c)}.row{padding:12px 0;border-bottom:1px dashed #aaa}.row:last-child{border:0}.label{font-size:10px;font-weight:950;margin-bottom:7px}.items{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.p{--h:32px;--fs:12px;height:var(--h);font-size:var(--fs);font-weight:1000;border:2px solid var(--ink);border-radius:7px;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0 .7em}.h18{--h:18px;--fs:8px;border-radius:4px}.h24{--h:24px;--fs:10px;border-radius:5px}.h32{--h:32px;--fs:12px}.h38{--h:38px;--fs:16px;border-radius:8px}.primary{background:var(--a)}.secondary{background:color-mix(in srgb,var(--a) 20%,white)}.icon{width:var(--h);padding:0;box-shadow:3px 3px 0 color-mix(in srgb,var(--a) 50%,transparent)}.h18.icon{box-shadow:none}.toggle{width:calc(var(--h)*1.7);padding:2px;justify-content:flex-start;border-radius:999px;background:var(--a)}.knob{height:calc(100% - 4px);aspect-ratio:1;border-radius:50%;border:0;background:var(--ink);transform:translateX(calc(var(--h)*.7))}.progress{width:130px;padding:0;justify-content:flex-start;overflow:hidden;background:#fff}.progress i{height:100%;width:62%;background:var(--a);border-right:2px solid var(--ink)}.split{padding:0;overflow:hidden}.split b{height:100%;aspect-ratio:1;display:grid;place-items:center;background:var(--a);border-right:2px solid var(--ink)}.split span{padding:0 .65em}.tag{font-size:8px;font-weight:950;padding:2px 5px;border:2px solid var(--ink);border-radius:4px;background:color-mix(in srgb,var(--c) 35%,white)}@media(min-width:800px){.page{padding:24px}.body{padding:16px}}</style></head><body><main class="page"><section class="card"><header><h1>VIEWTUBE WIDGET PRIMITIVES</h1><p class="sub">12 colors · 4 exact sizes · mobile reference lab · v1.2</p></header><div class="body"><div class="palette" id="pal"></div></div></section><div id="lib"></div><section class="card"><header><h2>A–Z SPECTRUM TAGS</h2></header><div class="body"><div class="items" id="tags"></div></div></section></main><script>const cs=['#f05a67','#ff765d','#ff9b45','#ffd34e','#a8dc4a','#50c878','#3cc7ad','#34cdea','#528ffa','#8c68e8','#cf65dc','#f36bb5'];cs.forEach(c=>pal.insertAdjacentHTML('beforeend',`<button class="sw" style="--c:${c}" onclick="document.documentElement.style.setProperty('--a','${c}')"></button>`));const sizes=[['h18','18PX / 8PX TEXT'],['h24','24PX / 10PX TEXT'],['h32','32PX / 12PX TEXT'],['h38','38PX / 16PX TEXT']];const groups=[['BUTTONS + ICON SHADOWS',(s)=>`<button class="p ${s}">BUTTON</button><button class="p ${s} primary">PRIMARY</button><button class="p ${s} secondary">SECONDARY</button><button class="p ${s} icon">＋</button>`],['TOGGLES + SELECTION',(s)=>`<button class="p ${s} toggle"><i class="knob"></i></button><button class="p ${s}" style="width:var(--h);padding:0;border-radius:50%"><i style="width:55%;height:55%;border-radius:50%;background:var(--a)"></i></button><button class="p ${s} primary" style="width:var(--h);padding:0">✓</button>`],['INPUTS + SPLIT CONTROLS',(s)=>`<div class="p ${s}">INPUT TEXT</div><div class="p ${s} split"><b>⌕</b><span>SEARCH</span></div><div class="p ${s} split"><b>−</b><span>12</span><b style="border:0;border-left:2px solid var(--ink)">+</b></div>`],['PROGRESS + BADGES',(s)=>`<div class="p ${s} progress"><i></i></div><span class="p ${s} primary">LIVE •</span><span class="p ${s} secondary">BADGE</span>`]];groups.forEach(([n,f])=>{let rows=sizes.map(([s,l])=>`<div class="row"><div class="label">${l}</div><div class="items">${f(s)}</div></div>`).join('');lib.insertAdjacentHTML('beforeend',`<section class="card"><header><h2>${n}</h2></header><div class="body">${rows}</div></section>`)});for(let i=0;i<26;i++)tags.insertAdjacentHTML('beforeend',`<span class="tag" style="--c:${cs[Math.floor(i*12/26)]}">${String.fromCharCode(65+i)} TAG</span>`);</script></body></html>
