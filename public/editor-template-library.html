<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ViewTube Editor Template Library</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#171717;font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px}.hero,.section{border:3px solid #171717;border-radius:14px;background:white;overflow:hidden;margin-bottom:18px;box-shadow:7px 7px 0 #34cdea80}.head{padding:14px 16px;background:#34cdea;border-bottom:3px solid #171717}.head h1,.head h2,.head p{margin:0}.head h1{font-size:24px;font-weight:900}.head h2{font-size:17px}.head p{font-size:11px;font-weight:700}.filters{display:flex;gap:7px;flex-wrap:wrap;padding:12px}.filters button{border:2px solid #171717;border-radius:7px;background:#fff;font-weight:900;padding:7px 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:12px}.card{aspect-ratio:16/9;border:2px solid #171717;border-radius:9px;overflow:hidden;position:relative;background:white}.label{position:absolute;bottom:6px;left:6px;background:#fff;border:2px solid #171717;border-radius:5px;padding:3px 6px;font-size:9px;font-weight:900}.sample{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.type{padding:18px;align-items:flex-start;justify-content:center;flex-direction:column}.type b{font-size:28px;line-height:.9;font-weight:900}.type small{font-size:9px;font-weight:900;margin-top:8px}.pattern{background-color:#fff}.pal{display:flex;gap:5px;padding:12px;flex-wrap:wrap}.sw{width:31px;height:25px;border:2px solid #171717;border-radius:5px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}.wrap{padding:9px}.head h1{font-size:18px}.type b{font-size:18px}}</style></head><body><main class="wrap"><section class="hero"><div class="head"><h1>EDITOR DESIGN LIBRARY</h1><p>SVG COMPOSITIONS · BACKGROUNDS · PATTERNS · TEXT · GRAPHICS · MOTION</p></div><div class="pal" id="pal"></div><div class="filters"><button>ALL</button><button>BACKGROUNDS</button><button>PATTERNS</button><button>TEXT</button><button>GRAPHICS</button><button>SCENES</button><button>MOTION</button></div></section><section class="section"><div class="head"><h2>GRADIENT BACKGROUNDS</h2></div><div class="grid" id="grad"></div></section><section class="section"><div class="head"><h2>SVG PATTERNS</h2></div><div class="grid" id="patterns"></div></section><section class="section"><div class="head"><h2>TEXT COMPOSITIONS</h2></div><div class="grid" id="text"></div></section></main><script>const c=['#f05a67','#ff765d','#ff9b45','#ffd34e','#a8dc4a','#50c878','#3cc7ad','#34cdea','#528ffa','#8c68e8','#cf65dc','#f36bb5'];c.forEach(x=>pal.innerHTML+=`<i class="sw" style="background:${x}"></i>`);for(let i=0;i<36;i++){let a=c[i%12],b=c[(i+3+(i%5))%12],ang=(i*25)%360;grad.innerHTML+=`<div class="card"><div class="sample" style="background:linear-gradient(${ang}deg,${a},${b})"></div><span class="label">GRADIENT ${String(i+1).padStart(2,'0')}</span></div>`}const ps=[['GRID','linear-gradient(#17171722 2px,transparent 2px),linear-gradient(90deg,#17171722 2px,transparent 2px)','24px 24px'],['DOTS','radial-gradient(#171717 2px,transparent 2px)','22px 22px'],['STRIPES','repeating-linear-gradient(0deg,#17171718 0 5px,transparent 5px 18px)','auto'],['DIAGONAL','repeating-linear-gradient(45deg,#17171718 0 4px,transparent 4px 18px)','auto'],['CHECKER','conic-gradient(#17171718 25%,transparent 0 50%,#17171718 0 75%,transparent 0)','28px 28px'],['RINGS','radial-gradient(circle,transparent 7px,#17171722 8px 10px,transparent 11px)','28px 28px']];for(let i=0;i<24;i++){let p=ps[i%ps.length],bg=c[(i+7)%12]+'33';patterns.innerHTML+=`<div class="card"><div class="sample pattern" style="background-color:${bg};background-image:${p[1]};background-size:${p[2]}"></div><span class="label">${p[0]} ${Math.floor(i/ps.length)+1}</span></div>`}const tx=[['YOUR STORY','STARTS HERE'],['THE BIG IDEA','HERO CENTER'],['CHAPTER 01','SECTION TITLE'],['87%','KEY STATISTIC'],['WHAT HAPPENED NEXT?','QUESTION'],['2 DECEMBER 1805','AUSTERLITZ'],['EVERYTHING CHANGED.','VIDEO HOOK'],['NAPOLEON BONAPARTE','EMPEROR OF THE FRENCH'],['“I SAW IT MYSELF.”','EYEWITNESS'],['THE END','CONCLUSION']];tx.forEach((t,i)=>text.innerHTML+=`<div class="card"><div class="sample type" style="background:${c[i%12]}55"><b>${t[0]}</b><small>${t[1]}</small></div><span class="label">TEXT ${String(i+1).padStart(2,'0')}</span></div>`);</script></body></html>
