<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContentBuild Lab 01–05</title><style>:root{--ink:#151515;--paper:#f7f4ec;--blue:#66d5ff;--yellow:#ffd84d;--pink:#ff7daf;--green:#75e3a1;--r:10px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;font-weight:800}header{position:sticky;top:0;z-index:9;background:var(--paper);border-bottom:4px solid var(--ink);padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0;text-transform:uppercase}.meta{font-size:9px;opacity:.65}.wrap{padding:18px;display:grid;gap:24px}.demo{border:4px solid var(--ink);border-radius:14px;background:white;box-shadow:8px 8px 0 #15151522;overflow:hidden}.head{padding:12px 14px;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center}.head b{font-size:13px;text-transform:uppercase}.num{width:28px;height:28px;border:3px solid var(--ink);border-radius:7px;display:grid;place-items:center;background:var(--yellow)}.body{padding:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.box,.action,.asset{border:2px solid var(--ink);border-radius:8px;padding:9px;background:#fff;min-width:0}.box strong,.asset strong{display:block;font-size:10px;text-transform:uppercase}.small{font-size:9px;opacity:.62}.status{display:inline-block;margin-top:5px;padding:2px 5px;border:1.5px solid;border-radius:4px;font-size:8px}.ready{background:#c9f5d8}.warn{background:#ffe5a0}.rail{display:flex;gap:5px;overflow:auto}.pill{white-space:nowrap;border:2px solid var(--ink);border-radius:6px;padding:6px 8px;font-size:9px;background:#fff}.pill.on{background:var(--blue)}button{font:inherit;color:inherit;cursor:pointer}.action{background:var(--blue);font-size:9px;text-transform:uppercase}.asset{position:relative;padding-top:34px}.asset:before{content:'';position:absolute;left:0;top:0;width:100%;height:24px;background:var(--pink);border-bottom:2px solid var(--ink)}.micro{display:flex;gap:3px;overflow:auto}.micro span{border:2px solid var(--ink);padding:7px;font-size:8px;white-space:nowrap}.toolrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;border-bottom:2px solid #15151522;padding:7px 0}.toolrow:last-child{border:0}.toolrow button{border:2px solid var(--ink);border-radius:6px;padding:6px;background:var(--yellow);font-size:8px}.activeOnly .empty{display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:10px}.demo{border-width:3px}.toolrow{grid-template-columns:1fr auto}.toolrow button:last-child{grid-column:1/-1}.head{padding:9px}.body{padding:10px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><header><div><h1>Video Package / Asset Engine — Improved 01–05</h1><div class="meta">FIVE MANIFESTATIONS · ONE CONTENTBUILD · EDIT ONCE / REFLECT EVERYWHERE</div></div><button id="mode" class="pill">ACTIVE ONLY</button></header><main class="wrap" id="root"></main><script>const B={id:'CB-037',name:'Napoleon — The Last Charge',concept:'Eyewitness-driven cavalry story',research:'12 sources',script:'V6 FINAL',storyboard:'18 scenes',images:'27 assets',audio:'4 assets',title:'8 variants · V4 final',thumbnail:'5 variants · FINAL NEEDED',description:'FINAL',tags:'22',publish:'Sep 18 · 18:00',captions:'MISSING'};const root=document.querySelector('#root');function demo(n,title,html){return `<section class="demo"><div class="head"><div style="display:flex;gap:9px;align-items:center"><span class="num">${n}</span><b>${title}</b></div><span class="small">${B.id}</span></div><div class="body">${html}</div></section>`}const domains=[['Concept',B.concept,'ready'],['Research',B.research,'ready'],['Script',B.script,'ready'],['Storyboard',B.storyboard,'ready'],['Images',B.images,'ready'],['Audio',B.audio,'ready'],['Title',B.title,'ready'],['Thumbnail',B.thumbnail,'warn'],['Description',B.description,'ready'],['Tags',B.tags,'ready'],['Captions',B.captions,'warn'],['End screen','EMPTY','empty']];function render(){root.innerHTML=demo(1,'Content Build Command Module',`<div class="grid">${domains.map(x=>`<div class="box ${x[2]}"><strong>${x[0]}</strong><div class="small">${x[1]}</div><span class="status ${x[2]}">${x[2]==='ready'?'READY':x[2]==='warn'?'ACTION':'EMPTY'}</span></div>`).join('')}</div>`)+demo(2,'Adaptive Presence Package',`<div class="grid">${domains.map(x=>`<div class="box ${x[2]}"><strong>${x[0]}</strong><div class="small">${x[1]}</div></div>`).join('')}</div><button class="action" style="margin-top:9px">+ ADD ASSET DOMAIN</button>`)+demo(3,'Vault Manifestation',`<div class="grid">${[['SCRIPT','V6 · FINAL'],['THUMBNAILS','5 VARIANTS'],['IMAGES','27 FILES'],['AUDIO','4 FILES'],['METADATA','TITLE + DESCRIPTION'],['PUBLISH','SCHEDULED']].map(x=>`<div class="asset"><strong>${x[0]}</strong><span class="small">${x[1]}</span></div>`).join('')}</div>`)+demo(4,'Micro Package Strip',`<div class="micro"><span>VIDEO 37</span><span>IDEA ✓</span><span>SCRIPT ✓</span><span>THUMB 5 !</span><span>META ✓</span><span>PUB 11/13</span><span>READY 84%</span></div><div class="small" style="margin-top:8px">Portable summary for Kanban · Calendar · Video Manager · Vault · Editor</div>`)+demo(5,'Tool Launcher Package',`${[['THUMBNAIL','5 variants · final needed','OPEN STUDIO'],['TITLE','V4 final','OPEN TITLE LAB'],['SCRIPT','V6 final','OPEN SCRIPT'],['PUBLISHING','11/13 ready','OPEN PUBLISHER']].map(x=>`<div class="toolrow"><div><strong style="font-size:10px">${x[0]}</strong><div class="small">${x[1]}</div></div><button>${x[2]}</button><button data-gen="${x[0]}">GENERATE</button></div>`).join('')}`);document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{b.textContent='ATTACHED ✓';b.style.background='var(--green)'})}render();document.querySelector('#mode').onclick=e=>{document.body.classList.toggle('activeOnly');e.currentTarget.textContent=document.body.classList.contains('activeOnly')?'SHOW ALL':'ACTIVE ONLY'};</script></body></html>
