name: Phase 5 Built UI Screenshots

on:
  push:
    branches:
      - themotionvisual/feat/brain-phase-five-production-chains
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Vercel preview URL to capture'
        required: false
        type: string
      share_url:
        description: 'Temporary Vercel share URL for protected previews'
        required: false
        type: string

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture authenticated desktop and mobile UI
        env:
          PREVIEW_URL: ${{ inputs.preview_url || 'https://viewtube-cjldmx5do-cbrewsterart-1584s-projects.vercel.app' }}
          VERCEL_SHARE_URL: ${{ inputs.share_url || 'https://viewtube-cjldmx5do-cbrewsterart-1584s-projects.vercel.app/?_vercel_share=UngRhJUAW6bUb9a8A4aSve5p0AgF8Lxd' }}
        run: node scripts/capture-phase5-built-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-built-ui-screenshots
          path: artifacts/phase5-built-ui
          if-no-files-found: warn
          retention-days: 14
