<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ViewTube — Master Micro Dense Compositions</title>
<style>
:root{
  --paper:#fff;
  --ink:#050505;
  --p1:#FA618A;--p2:#FF7F6B;--p3:#FFA85C;--p4:#FFDA47;
  --p5:#C0F240;--p6:#3FEE56;--p7:#4EE4BE;--p8:#36E0F6;
  --p9:#528FFA;--p10:#A467F4;--p11:#F55EFC;--p12:#FF7AC8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{padding:3px}
main{width:min(1480px,100%);margin:auto}
.top{
  height:22px;display:flex;align-items:center;justify-content:space-between;
  padding:0 3px;border-bottom:1px solid #000;margin-bottom:2px
}
.top b{font-size:9px;font-weight:1000;letter-spacing:.04em}
.top span{font-size:6px;font-weight:1000;letter-spacing:.08em}
.field{
  display:grid;
  grid-template-columns:repeat(24,minmax(0,1fr));
  grid-auto-rows:7px;
  grid-auto-flow:dense;
  gap:1px;
  align-items:stretch;
  overflow:hidden;
}
.micro{
  grid-column:span var(--c);
  grid-row:span var(--r);
  margin:0;
  min-width:0;
  min-height:0;
  position:relative;
  overflow:hidden;
  background:#fff;
  border:0;
  border-radius:0;
  box-shadow:none;
  isolation:isolate;
  touch-action:manipulation;
}
.visual{width:100%;height:100%;overflow:hidden;position:relative}
.visual>svg,
.visual svg{width:100%;height:100%;display:block;overflow:visible}
.visual .sparkgrid{
  display:grid!important;
  grid-template-columns:repeat(3,1fr)!important;
  grid-template-rows:repeat(2,1fr)!important;
  gap:1px!important;
  width:100%;height:100%;
}
.visual .spark{
  height:auto!important;min-height:0!important;
  padding:0!important;margin:0!important;
  border:0!important;overflow:hidden!important;
}
.visual .spark b,.visual .spark strong{display:none!important}
.visual .spark svg{height:100%!important;width:100%!important}
figcaption{
  position:absolute;left:2px;top:1px;z-index:4;
  margin:0;padding:1px 2px;
  font-size:5px;line-height:1;font-weight:1000;
  letter-spacing:.015em;text-transform:uppercase;
  background:rgba(255,255,255,.72);
  opacity:0;pointer-events:none;
}
.micro:hover figcaption,.micro.focus figcaption{opacity:1}
.micro:hover,.micro.focus{
  z-index:30;
  outline:1px solid #000;
  outline-offset:-1px;
  background:#fff;
}
.micro:hover .visual,.micro.focus .visual{transform:scale(1.035)}
.visual{transition:transform 150ms ease}
/* keep the composition, lose card/module chrome */
.visual [style*="overflow:auto"]{overflow:hidden!important}
/* tighter micro spark/readability */
.visual text{font-family:Arial,Helvetica,sans-serif;font-weight:900}
/* optional hover/tap target overlay only; no visible modules */
.micro::after{
  content:"";position:absolute;inset:0;z-index:6;background:transparent;pointer-events:none
}
@media(max-width:900px){
  body{padding:2px}
  .top{height:19px;margin-bottom:1px}
  .field{
    grid-template-columns:repeat(12,minmax(0,1fr));
    grid-auto-rows:6px;
    gap:1px
  }
  .micro{
    --mc:max(3,calc(var(--c)/2));
  }
  .m1,.m2,.m6,.m8,.m12,.m18{grid-column:span 6}
  .m3,.m5,.m9,.m10,.m15,.m16,.m17{grid-column:span 4}
  .m4,.m7,.m11,.m13,.m14{grid-column:span 6}
  figcaption{font-size:4.6px}
}
@media(max-width:480px){
  .field{grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:5px}
  .micro{grid-column:span 4!important}
  .m4,.m8,.m18{grid-column:span 8!important}
  .m1,.m2,.m6,.m12,.m14{grid-column:span 8!important}
}
</style>
</head>
