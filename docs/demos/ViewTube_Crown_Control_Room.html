<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ViewTube Crown Control Room</title><style>:root{--ink:#000;--paper:#f2f2ef;--white:#fff;--rose:#fa618a;--orange:#ffa85c;--yellow:#ffda47;--lime:#c0f240;--green:#3fee56;--teal:#4ee4be;--cyan:#36e0f6;--blue:#528ffa;--purple:#a467f4;--pink:#f55efc;--gap:18px}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.45 Arial,Helvetica,sans-serif;color:#000}.top{border-bottom:4px solid #000;background:var(--green);padding:18px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font:900 28px/1 Arial Black,Arial}.badge{border:2px solid #000;background:#fff;padding:4px 7px;font:800 10px monospace}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 72px)}nav{background:#fff;border-right:4px solid #000;padding:14px}button{border:3px solid #000;background:#fff;padding:10px 12px;font-weight:900;cursor:pointer}nav button{width:100%;text-align:left;margin-bottom:7px}nav button.active{background:var(--yellow)}main{padding:24px;max-width:1500px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}.card{background:#fff;border:4px solid #000;box-shadow:5px 5px 0 #000}.head{padding:12px 14px;border-bottom:4px solid #000;font:900 18px Arial Black,Arial}.body{padding:16px}.king .head{background:var(--rose)}.emperor .head{background:var(--cyan)}.bridge .head{background:var(--yellow)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}.node{border:3px solid #000;padding:12px;background:#fff}.node b{display:block;font:900 14px Arial Black,Arial;margin-bottom:6px}.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.step{border:2px solid #000;padding:8px;background:#fff;font:800 11px monospace}.arrow{font-weight:900}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:2px solid #000;padding:10px;background:#fff}.stat strong{font:900 22px Arial Black,Arial;display:block}.mono{font-family:monospace;font-size:12px}.panel{margin-top:var(--gap)}textarea{width:100%;min-height:145px;border:3px solid #000;padding:12px;font:12px/1.5 monospace;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ok{background:var(--lime)}.warn{background:var(--orange)}@media(max-width:900px){.layout{display:block}nav{border-right:0;border-bottom:4px solid #000;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.hero,.grid{grid-template-columns:1fr}.status{grid-template-columns:repeat(2,1fr)}main{padding:15px}}</style></head><body><header class="top"><div class="brand">VIEWTUBE CROWN CONTROL ROOM</div><span class="badge">OFFLINE PROTOCOL DEMO · NO RUNTIME WRITES</span></header><div class="layout"><nav><button class="active" data-view="mission">01 MISSION</button><button data-view="roles">02 ROLES</button><button data-view="exchange">03 EXCHANGE</button><button data-view="verify">04 VERIFY</button></nav><main id="app"></main></div><script>const views={mission:()=>`<section class="hero"><article class="card king"><div class="head">KING · DESIRED STATE</div><div class="body"><p>Owns creator intent, product meaning, plans, artifacts, acceptance and tradeoffs.</p><div class="actions"><button class="ok" onclick="seed()">Create VT_MISSION</button></div></div></article><article class="card emperor"><div class="head">EMPEROR · EXECUTABLE STATE</div><div class="body"><p>Owns repository truth, work orders, implementation, tests, services and deployment receipts.</p><div class="actions"><button onclick="work()">Translate to Work Order</button></div></div></article></section><article class="card bridge"><div class="head">CROWN LIFECYCLE</div><div class="body"><div class="flow">${['DISCOVER','SYNTHESIZE','DECIDE','PLAN EXECUTION','EXECUTE','VERIFY','LEARN / ARCHIVE'].map((x,i)=>`<span class="step">${x}</span>${i<6?'<span class="arrow">→</span>':''}`).join('')}</div></div></article><article class="card panel"><div class="head">MISSION PACKET</div><div class="body"><textarea id="packet">Select “Create VT_MISSION” to load an example.</textarea></div></article>`,roles:()=>`<div class="grid"><article class="card king"><div class="head">KINGDOM</div><div class="body">${['KING · Mission integration','PRINCE Observatory · data/UI','PRINCE Citadel · trust/account','PRINCE Brain · AI/context','PRINCE Forge · creation/editor','PRINCE Compass · mission/philosophy'].map(x=>`<div class="node"><b>${x}</b>Defines desired behavior and acceptance.</div>`).join('')}</div></article><article class="card emperor"><div class="head">REPUBLIC</div><div class="body">${['EMPEROR · execution','Marshal Intelligence','Marshal Task Authority','Marshal Docs Archivist','Marshal Code Gardener','Marshal Service Membrane','Marshal Design System','Marshal Video Studio','Marshal Brain Cognition'].map(x=>`<div class="node"><b>${x}</b>Constrains and verifies executable reality.</div>`).join('')}</div></article><article class="card bridge"><div class="head">SHARED BRIDGE</div><div class="body">${['Grand Artifact Compiler','Skill Finder','Solution Finder','Docs Grill','Conflict Arbiter','Verification Chancellor'].map(x=>`<div class="node"><b>${x}</b>Shared knowledge and verification service.</div>`).join('')}</div></article></div>`,exchange:()=>`<article class="card bridge"><div class="head">ROYAL EXCHANGE</div><div class="body"><div class="status"><div class="stat"><strong>1</strong><span>VT_MISSION</span></div><div class="stat"><strong>1</strong><span>VT_WORK_ORDER</span></div><div class="stat"><strong>4</strong><span>VT_RECEIPTS</span></div><div class="stat"><strong>0</strong><span>UNRESOLVED CONFLICTS</span></div></div><p class="mono" style="margin-top:16px">missions/ · work-orders/ · receipts/ · decisions/ · artifacts/ · handoffs/</p><p>Structured records prevent agent-to-agent context from disappearing into chat and make product intent, executable work, evidence and artifact provenance independently inspectable.</p></div></article>`,verify:()=>`<article class="card"><div class="head" style="background:var(--teal)">VERIFICATION CHANCELLOR</div><div class="body"><div class="grid">${['Scope matches work order','Canonical owners preserved','Tests pass','Build/typecheck evidence','Runtime behavior inspected','Mobile/container behavior','Service boundaries checked','Preview vs production distinguished','Rollback documented'].map(x=>`<div class="node"><b>${x}</b><span class="badge">RECEIPT REQUIRED</span></div>`).join('')}</div><p style="margin-top:16px"><b>Completion rule:</b> plans are not code; code is not integration; integration is not verified runtime; preview is not production.</p></div></article>`};function render(k='mission'){document.getElementById('app').innerHTML=views[k]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===k))}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>render(b.dataset.view));function seed(){document.getElementById('packet').value=JSON.stringify({schemaVersion:'viewtube.mission.v2',missionId:'VT-MISSION-DEMO-001',objective:'Improve a ViewTube capability without duplicating canonical ownership.',nonGoals:['No direct main commit','No prototype promoted without verification'],acceptance:['Current owner identified','Bounded diff','Required checks have receipts'],authorization:{externalWrites:false},risk:'low',rollback:'Revert feature branch/PR.',state:'approved-for-execution'},null,2)}function work(){const e=document.getElementById('packet');if(e)e.value=JSON.stringify({schemaVersion:'viewtube.work-order.v1',missionId:'VT-MISSION-DEMO-001',executionId:'EXEC-DEMO-001',checkout:'feature branch from current main',baseSha:'<resolve-current-main>',headSha:null,orderedSteps:['inspect owner','implement bounded change','run focused tests','build','preview verify'],writerScopes:[{owner:'specialist',paths:['<exact paths resolved from main>']}],reviewers:['viewtube-verification-chancellor'],testsRequired:['focused contract suite','npm run build'],deploymentRequired:false},null,2)}render();</script></body></html>
